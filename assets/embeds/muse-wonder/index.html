    document.querySelectorAll("[data-step-theme]").forEach((button) => {
      const selected = button.dataset.stepTheme === activeTheme;
      button.setAttribute("aria-pressed", String(selected));
    });
    document.querySelectorAll("[data-step-format]").forEach((button) => {
      const selected = button.dataset.stepFormat === activeFormat;
      button.setAttribute("aria-pressed", String(selected));
    });

    const dimensionsLabel =
      document.querySelector("[data-step-preview-size]") ||
      document.querySelector(".preview-meta > span");
    if (dimensionsLabel) {
      dimensionsLabel.textContent = `${WIDTH} \u00d7 ${HEIGHT}`;
    }
    const aspectRatio = `${WIDTH} / ${HEIGHT}`;
    const shell = document.querySelector(".canvas-shell");
    if (shell) {
      shell.dataset.stepFormat = activeFormat;
      shell.dataset.format = activeFormat;
      shell.dataset.canvasFormat = activeFormat;
      shell.style.aspectRatio = aspectRatio;
      shell.style.backgroundColor = state.backgroundColor;
    }

    // The blog embeds the canvas inside an HTML-demo stage and a media frame,
    // rather than the standalone tool's `.canvas-shell`. Keep those wrappers
    // in sync so the mobile format is a true 1:1 stage instead of a square
    // canvas stretched into the desktop 16:9 frame.
    const blogStage = canvas.closest('[data-testid="html-demo-stage"]');
    if (blogStage) {
      blogStage.dataset.stepFormat = activeFormat;
      blogStage.style.aspectRatio = aspectRatio;
      blogStage.style.setProperty(
        "--html-demo-native-aspect-ratio",
        aspectRatio,
      );
      blogStage.style.setProperty(
        "--html-demo-authored-height",
        `${HEIGHT}px`,
      );
      blogStage.style.setProperty("--html-demo-native-width", `${WIDTH}px`);
    }
    const blogMediaFrame = canvas.closest("[data-media-presentation]");
    if (blogMediaFrame) {
      blogMediaFrame.dataset.stepFormat = activeFormat;
      blogMediaFrame.style.aspectRatio = aspectRatio;
    }
    const tool = document.querySelector("#step-flow-tool, .step-tool");
    if (tool) {
      tool.dataset.canvasFormat = activeFormat;
      tool.dataset.colorTheme = activeTheme;
    }
    canvas.dataset.stepFormat = activeFormat;

    const heroPositionX = document.querySelector(
      '[data-step-setting="heroPositionX"]',
    );
    const heroPositionY = document.querySelector(
      '[data-step-setting="heroPositionY"]',
    );
    if (heroPositionX) heroPositionX.max = String(WIDTH);
    if (heroPositionY) heroPositionY.max = String(HEIGHT);

    const saveLabel =
      document.querySelector("#step-save-settings-label") ||
      document.querySelector("#step-save-variant-label");
    if (saveLabel) saveLabel.textContent = "Save settings";
  }

  function showSettingsStatus(message) {
    const status = document.querySelector("#step-settings-status");
    if (!status) return;
    status.textContent = message;
    window.clearTimeout(showSettingsStatus.timeout);
    showSettingsStatus.timeout = window.setTimeout(() => {
      status.textContent = "";
    }, 2600);
  }

  function escapeJsonForHtml(value) {
    return JSON.stringify(value)
      .replace(/</g, "\\u003c")
      .replace(/>/g, "\\u003e")
      .replace(/&/g, "\\u0026")
      .replace(/\u2028/g, "\\u2028")
      .replace(/\u2029/g, "\\u2029");
  }

  function escapeClosingRawTag(source, tagName) {
    const closingTagStart = "<" + "/" + tagName;
    return source.replace(
      new RegExp(closingTagStart, "gi"),
      "<\\/" + tagName,
    );
  }

  function blobAsDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.addEventListener("load", () => resolve(reader.result), {
        once: true,
      });
      reader.addEventListener(
        "error",
        () => reject(reader.error || new Error("The font could not be read.")),
        { once: true },
      );
      reader.readAsDataURL(blob);
    });
  }

  async function standaloneFontDataUrl() {
    const dataUrlPattern =
      /url\(\s*["']?(data:font\/woff2;base64,[^"')\s]+)["']?\s*\)/i;
    const packagedFontDataUrl = window.__STEP_REPEAT_FONT_DATA_URL__;
    if (
      typeof packagedFontDataUrl === "string" &&
      packagedFontDataUrl.startsWith("data:font/woff2;base64,")
    ) {
      return packagedFontDataUrl;
    }
    for (const style of document.querySelectorAll("style")) {
      const match = style.textContent?.match(dataUrlPattern);
      if (match) return match[1];
    }
    if (window.location.protocol === "file:") {
      throw new Error(
        "Open the self-contained tool or serve this page locally so the font can be packaged.",
      );
    }
    const response = await fetch(new URL(FONT_SOURCE_PATH, document.baseURI));
    if (!response.ok) {
      throw new Error(`The font request failed (${response.status}).`);
    }
    return blobAsDataUrl(await response.blob());
  }

  function standaloneCanvasCss(
    fontDataUrl,
    pageBackground = "transparent",
    width = WIDTH,
    height = HEIGHT,
  ) {
    const aspect = width / Math.max(1, height);
    const viewportHeightWidth = (80 * aspect).toFixed(4);
    return `
      @font-face {
        font-family: "${PRIMARY_FONT_FAMILY}";
        src: url("${fontDataUrl}") format("woff2");
        font-style: normal;
        font-weight: 300 800;
        font-display: block;
      }
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-width: 0; min-height: 100%; margin: 0; }
      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        overflow: hidden;
        background: ${pageBackground};
      }
      .canvas-frame {
        width: min(80vw, ${width}px, ${viewportHeightWidth}vh);
        width: min(80vw, ${width}px, ${viewportHeightWidth}dvh);
        aspect-ratio: ${width} / ${height};
        overflow: hidden;
      }
      #step-repeat-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: 0;
        cursor: crosshair;
        touch-action: none;
        user-select: none;
      }
      #step-repeat-canvas:focus-visible {
        outline: 2px solid #0082fb;
        outline-offset: -5px;
      }
    `;
  }

  function standaloneTimestamp(date) {
    return date
      .toISOString()
      .replace(/\.\d{3}Z$/, "Z")
      .replace(/[-:]/g, "")
      .replace("T", "-");
  }

  function desktopBlogPreviewUrl() {
    saveState();
    const snapshot = {
      exportVersion: 3,
      exportedAt: new Date().toISOString(),
      theme: activeTheme,
      format: "desktop",
      dimensions: { ...FORMAT_DIMENSIONS.desktop },
      settings: { ...state },
      model: JSON.parse(JSON.stringify(settingsModel)),
      responsive: true,
    };
    const fragment = new URLSearchParams({
      [BLOG_PREVIEW_SNAPSHOT_PARAMETER]: JSON.stringify(snapshot),
    }).toString();

    let previewUrl;
    if (
      typeof INLINE_BLOG_PREVIEW_HTML === "string" &&
      INLINE_BLOG_PREVIEW_HTML.length > 0
    ) {
      if (blogPreviewObjectUrl) URL.revokeObjectURL(blogPreviewObjectUrl);
      blogPreviewObjectUrl = URL.createObjectURL(
        new Blob([INLINE_BLOG_PREVIEW_HTML], {
          type: "text/html;charset=utf-8",
        }),
      );
      previewUrl = new URL(blogPreviewObjectUrl);
    } else {
      previewUrl = new URL(BLOG_PREVIEW_PATH, document.baseURI);
    }
    previewUrl.hash = fragment;
    return previewUrl.href;
  }

  async function shareCanvasHtml() {
    const shareButton = document.querySelector("#step-share-canvas");
    if (!shareButton) return;
    shareButton.disabled = true;
    shareButton.setAttribute("aria-busy", "true");
    shareButton.textContent = "Preparing…";
    showSettingsStatus("Packaging canvas, settings, and font.");
    let objectUrl = null;
    try {
      const now = new Date();
      const iso = now.toISOString();
      const filename = `step-and-repeat-flow-${activeFormat}-${activeTheme}-${standaloneTimestamp(now)}.html`;
      const payload = {
        exportVersion: 2,
        exportedAt: iso,
        theme: activeTheme,
        format: activeFormat,
        dimensions: { width: WIDTH, height: HEIGHT },
        settings: { ...state },
      };
      const fontDataUrl = await standaloneFontDataUrl();
      const closeStyle = "<" + "/style>";
      const closeScript = "<" + "/script>";
      const runtime = escapeClosingRawTag(
        `${stepRepeatFlowApp.toString()}\nstepRepeatFlowApp();`,
        "script",
      );
      const pageBackground = state.backgroundColor;
      const playerCss = escapeClosingRawTag(
        standaloneCanvasCss(fontDataUrl, pageBackground, WIDTH, HEIGHT),
        "style",
      );
      const html = [
        "<!doctype html>",
        '<html lang="en">',
        "<head>",
        '<meta charset="UTF-8">',
        '<meta name="viewport" content="width=device-width, initial-scale=1.0">',
        `<meta name="description" content="Self-contained Step and Repeat Flow canvas exported ${iso}">`,
        `<title>Step and Repeat Flow — ${iso}</title>`,
        `<style>${playerCss}${closeStyle}`,
        "</head>",
        "<body>",
        `<main class="canvas-frame" data-step-format="${activeFormat}">`,
        `<canvas id="step-repeat-canvas" width="${WIDTH}" height="${HEIGHT}" data-step-format="${activeFormat}" tabindex="0" role="application" aria-label="Interactive Step and Repeat typographic animation"></canvas>`,
        "</main>",
        `<script id="${STANDALONE_CONFIG_ID}" type="application/json">${escapeJsonForHtml(payload)}${closeScript}`,
        `<script>${runtime}${closeScript}`,
        "</body>",
        "</html>",
      ].join("\n");
      const blob = new Blob([html], { type: "text/html;charset=utf-8" });
      objectUrl = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = objectUrl;
      link.download = filename;
      link.hidden = true;
      document.body.append(link);
      link.click();
      link.remove();
      const urlToRevoke = objectUrl;
      objectUrl = null;
      window.setTimeout(() => URL.revokeObjectURL(urlToRevoke), 60000);
      showSettingsStatus(`${filename} downloaded.`);
    } catch (error) {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      showSettingsStatus(
        error instanceof Error
          ? `Share failed: ${error.message}`
          : "Share failed.",
      );
    } finally {
      shareButton.disabled = false;
      shareButton.removeAttribute("aria-busy");
      shareButton.textContent = "Share canvas";
    }
  }

  function applySettings(settings, message, { restart = true } = {}) {
    if (!settings || typeof settings !== "object") return;
    const legacyWakeColor = HEX_COLOR.test(settings.wakeColor)
      ? settings.wakeColor
      : null;
    const legacyGlyphPulseColor = HEX_COLOR.test(settings.glyphPulseColor)
      ? settings.glyphPulseColor
      : null;
    Object.keys(DEFAULTS).forEach((key) => {
      state[key] = Object.prototype.hasOwnProperty.call(settings, key)
        ? settings[key]
        : DEFAULTS[key];
    });
    if (
      legacyWakeColor &&
      !Object.prototype.hasOwnProperty.call(settings, "wakeStartColor")
    ) {
      state.wakeStartColor = legacyWakeColor;
    }
    if (
      legacyWakeColor &&
      !Object.prototype.hasOwnProperty.call(settings, "wakeEndColor")
    ) {
      state.wakeEndColor = legacyWakeColor;
    }
    if (
      legacyGlyphPulseColor &&
      !HEX_COLOR.test(settings.glyphPulseStartColor)
    ) {
      state.glyphPulseStartColor = legacyGlyphPulseColor;
    }
    if (
      legacyGlyphPulseColor &&
      !HEX_COLOR.test(settings.glyphPulseEndColor)
    ) {
      state.glyphPulseEndColor = legacyGlyphPulseColor;
    }
    Object.entries(LIMITS).forEach(([key, [minimum, maximum]]) => {
      const value = Number(state[key]);
      state[key] = Number.isFinite(value)
        ? clamp(value, minimum, maximum)
        : DEFAULTS[key];
    });
    state.heroPositionX = clamp(state.heroPositionX, 0, WIDTH);
    state.heroPositionY = clamp(state.heroPositionY, 0, HEIGHT);
    state.sectionCount = Math.min(
      Math.round(state.sectionCount),
      Math.round(state.columns) * Math.round(state.rows),
    );
    COLOR_KEYS.forEach((key) => {
      if (!HEX_COLOR.test(state[key])) state[key] = DEFAULTS[key];
    });
    state.padReplacementStrings = state.padReplacementStrings !== false;
    state.continuousHeadlinesEnabled = true;
    state.heroCursorEnabled = state.heroCursorEnabled !== false;
    state.flowLongStringsEnabled = state.flowLongStringsEnabled !== false;
    state.flowWrapRows = state.flowWrapRows !== false;
    sourceGlyphs = splitGraphemes(state.sourceText).slice(0, 24);
    if (!sourceGlyphs.length) sourceGlyphs = ["W"];
    state.sourceText = sourceGlyphs.join("");
    HERO_TEXT_KEYS.forEach((key) => {
      state[key] = splitGraphemes(state[key] ?? DEFAULTS[key])
        .slice(0, 48)
        .join("");
    });
    randomGlyphs = splitGraphemes(state.characterPool)
      .filter((glyph) => !/\s|,/.test(glyph))
      .slice(0, 160);
    if (!randomGlyphs.length) randomGlyphs = ["✦"];
    state.characterPool = randomGlyphs.join("");
    paddingGlyphs = splitGraphemes(state.paddingGlyphPool)
      .filter((glyph) => !/\s|,/.test(glyph))
      .slice(0, 160);
    if (!paddingGlyphs.length) {
      paddingGlyphs = splitGraphemes(DEFAULTS.paddingGlyphPool);
    }
    state.paddingGlyphPool = paddingGlyphs.join("");
    pulseGlyphs = splitGraphemes(
      state.glyphPulseGlyphs || DEFAULTS.glyphPulseGlyphs,
    )
      .filter((glyph) => !/\s|,/.test(glyph))
      .slice(0, 32);
    if (!pulseGlyphs.length) {
      pulseGlyphs = splitGraphemes(DEFAULTS.glyphPulseGlyphs);
    }
    state.glyphPulseGlyphs = pulseGlyphs.join("");
    state.patternSeed = Math.max(1, Math.round(Number(state.patternSeed) || 1));
    for (let index = 1; index <= 8; index += 1) {
      const key = `replacementString${index}`;
      state[key] = splitGraphemes(state[key] ?? DEFAULTS[key])
        .slice(0, 144)
        .join("");
    }
    randomMaskCache = { key: "", mask: new Set() };
    sectionShuffleMaskCache.clear();
    layoutCache = null;
    syncControls();
    if (restart) {
      restartAnimation();
    } else {
      saveState();
      refreshStaticFrame();
      if (fontReady && !REDUCED_MOTION) draw(performance.now());
    }
    if (message) showSettingsStatus(message);
  }

  function stepRepeatStateDetail(reason, requestId = null) {
    const model = {
      version: 1,
      activeTheme,
      activeFormat,
      shared: { ...settingsModel.shared },
      colors: {
        light: { ...settingsModel.colors.light },
        dark: { ...settingsModel.colors.dark },
      },
      layouts: {
        desktop: { ...settingsModel.layouts.desktop },
        mobile: { ...settingsModel.layouts.mobile },
      },
    };
    SHARED_KEYS.forEach((key) => {
      model.shared[key] = state[key];
    });
    COLOR_KEYS.forEach((key) => {
      model.colors[activeTheme][key] = state[key];
    });
    LAYOUT_KEYS.forEach((key) => {
      model.layouts[activeFormat][key] = state[key];
    });
    return {
      apiVersion: 1,
      requestId,
      reason,
      theme: activeTheme,
      format: activeFormat,
      dimensions: { width: WIDTH, height: HEIGHT },
      settings: Object.fromEntries(
        Object.keys(DEFAULTS).map((key) => [key, state[key]]),
      ),
      model,
      limits: Object.fromEntries(
        Object.entries(LIMITS).map(([key, limits]) => [key, [...limits]]),
      ),
    };
  }

  function emitStepRepeatState(reason, requestId = null, eventName = "step-repeat:state") {
    window.dispatchEvent(
      new CustomEvent(eventName, {
        detail: stepRepeatStateDetail(reason, requestId),
      }),
    );
  }

  function setActiveTheme(theme) {
    if (!THEMES.includes(theme) || theme === activeTheme) return;
    saveState();
    activeTheme = theme;
    COLOR_KEYS.forEach((key) => {
      const color = settingsModel.colors[activeTheme][key];
      state[key] = HEX_COLOR.test(color) ? color : DEFAULTS[key];
    });
    saveState();
    syncControls();
    refreshStaticFrame();
    if (fontReady && !REDUCED_MOTION) draw(performance.now());
    showSettingsStatus(
      `${activeTheme === "dark" ? "Dark" : "Light"} mode selected.`,
    );
  }

  function setActiveFormat(format) {
    if (!FORMATS.includes(format) || format === activeFormat) return;
    saveState();
    activeFormat = format;
    const dimensions = FORMAT_DIMENSIONS[activeFormat];
    WIDTH = dimensions.width;
    HEIGHT = dimensions.height;
    pointer.x = WIDTH / 2;
    pointer.y = HEIGHT / 2;
    pointer.previousX = pointer.x;
    pointer.previousY = pointer.y;
    renderModeControls();
    resizeCanvas();
    applySettings(
      composedSettings(),
      `${activeFormat === "mobile" ? "Mobile" : "Desktop"} canvas selected.`,
    );
    saveState();
  }

  function storeLayoutSettings(format, patch) {
    if (!FORMATS.includes(format) || !patch || typeof patch !== "object") {
      return false;
    }
    const layoutPatch = Object.fromEntries(
      LAYOUT_KEYS.filter((key) =>
        Object.prototype.hasOwnProperty.call(patch, key),
      ).map((key) => [key, patch[key]]),
    );
    if (!Object.keys(layoutPatch).length) return false;

    const dimensions = FORMAT_DIMENSIONS[format];
    const normalized = normalizeSettings(
      {
        ...DEFAULTS,
        ...settingsModel.shared,
        ...settingsModel.layouts[format],
        ...settingsModel.colors[activeTheme],
        ...layoutPatch,
      },
      dimensions,
    );
    settingsModel.layouts[format] = pickedSettings(
      normalized,
      LAYOUT_KEYS,
      settingsModel.layouts[format],
    );
    return true;
  }

  function updateLayoutSettings(
    format,
    patch,
    { restart = true } = {},
  ) {
    // Capture the live format before mutating another layout. In the blog
    // embed this updates the in-memory model without forcing a localStorage
    // write; the explicit save event still persists the complete model.
    syncStateIntoModel();
    if (!storeLayoutSettings(format, patch)) return false;

    if (format === activeFormat) {
      applySettings(composedSettings(), null, { restart });
    } else {
      // Preserve the inactive layout in the same storage record used by the
      // existing save flow, without changing the rendered format.
      saveState();
    }
    return true;
  }

  function updateSettingsBatch(
    patch,
    layoutPatches,
    { restart = true } = {},
  ) {
    syncStateIntoModel();
    let activeLayoutChanged = false;
    let anyLayoutChanged = false;
    FORMATS.forEach((format) => {
      const changed = storeLayoutSettings(format, layoutPatches[format]);
      anyLayoutChanged ||= changed;
      activeLayoutChanged ||= changed && format === activeFormat;
    });

    const allowedPatch = {};
    if (patch && typeof patch === "object") {
      Object.keys(DEFAULTS).forEach((key) => {
        if (Object.prototype.hasOwnProperty.call(patch, key)) {
          allowedPatch[key] = patch[key];
        }
      });
    }
    const activeStateChanged = Object.keys(allowedPatch).length > 0;
    if (activeLayoutChanged || activeStateChanged) {
      applySettings(
        { ...composedSettings(), ...allowedPatch },
        null,
        { restart },
      );
    } else if (anyLayoutChanged) {
      // Inactive-layout-only edits update storage/model state but do not
      // redraw or restart the currently visible animation.
      saveState();
    }
    return activeLayoutChanged || activeStateChanged || anyLayoutChanged;
  }

  function syncResponsiveFormat() {
    if (!responsiveBlogMobileQuery) return false;
    const nextFormat = responsiveBlogMobileQuery.matches
      ? "mobile"
      : "desktop";
    if (nextFormat === activeFormat) return false;
    setActiveFormat(nextFormat);
    return true;
  }

  window.addEventListener("step-repeat:set-theme", (event) => {
    setActiveTheme(event.detail?.theme);
    emitStepRepeatState("theme");
  });

  window.addEventListener("step-repeat:request-state", (event) => {
    emitStepRepeatState("request", event.detail?.requestId ?? null);
  });

  window.addEventListener("step-repeat:save-settings", (event) => {
    const requestId = event.detail?.requestId ?? null;
    const ok = saveState({ forcePersist: true, verify: true });
    window.dispatchEvent(
      new CustomEvent("step-repeat:save-result", {
        detail: { requestId, ok },
      }),
    );
    emitStepRepeatState("save", requestId);
  });

  window.addEventListener("step-repeat:update-settings", (event) => {
    const detail = event.detail;
    if (!detail || typeof detail !== "object") return;
    if (THEMES.includes(detail.theme)) setActiveTheme(detail.theme);
    if (FORMATS.includes(detail.format)) setActiveFormat(detail.format);
    const patch = detail.patch;
    const layoutPatches =
      detail.layoutPatches &&
      typeof detail.layoutPatches === "object" &&
      !Array.isArray(detail.layoutPatches)
        ? detail.layoutPatches
        : null;
    if (layoutPatches) {
      updateSettingsBatch(patch, layoutPatches, {
        restart: detail.restart !== false,
      });
      emitStepRepeatState("update", detail.requestId ?? null);
      return;
    }
    if (!patch || typeof patch !== "object") {
      emitStepRepeatState("update", detail.requestId ?? null);
      return;
    }
    if (FORMATS.includes(detail.layoutFormat)) {
      updateLayoutSettings(detail.layoutFormat, patch, {
        restart: detail.restart !== false,
      });
      emitStepRepeatState("update", detail.requestId ?? null);
      return;
    }
    const allowedPatch = {};
    Object.keys(DEFAULTS).forEach((key) => {
      if (Object.prototype.hasOwnProperty.call(patch, key)) {
        allowedPatch[key] = patch[key];
      }
    });
    applySettings(
      { ...state, ...allowedPatch },
      null,
      { restart: detail.restart !== false },
    );
    emitStepRepeatState("update", detail.requestId ?? null);
  });

  window.addEventListener("step-repeat:restart", (event) => {
    restartAnimation({ newSeed: Boolean(event.detail?.newSeed) });
    emitStepRepeatState("restart", event.detail?.requestId ?? null);
  });

  function updateViewGeometry(bounds) {
    const nextScale = Math.max(
      0.0001,
      Math.min(
        1,
        bounds.width / Math.max(1, WIDTH),
        bounds.height / Math.max(1, HEIGHT),
      ),
    );
    const nextWidth = Math.max(WIDTH, bounds.width / nextScale);
    const nextHeight = Math.max(HEIGHT, bounds.height / nextScale);
    if (
      Math.abs(nextWidth - viewWidth) < 0.5 &&
      Math.abs(nextHeight - viewHeight) < 0.5 &&
      Math.abs(nextScale - viewScale) < 0.0001
    ) {
      return;
    }
    viewWidth = nextWidth;
    viewHeight = nextHeight;
    viewScale = nextScale;
    layoutCache = null;
    heroReturnGroupCache = {
      layout: null,
      key: "",
      groupByCell: new Map(),
      count: 0,
    };
    pointer.active = false;
    pointer.x = viewWidth / 2;
    pointer.y = viewHeight / 2;
    pointer.previousX = pointer.x;
    pointer.previousY = pointer.y;
  }

  function viewCropOffset(bounds) {
    const visibleWidth = bounds.width / Math.max(0.0001, viewScale);
    const visibleHeight = bounds.height / Math.max(0.0001, viewScale);
    return {
      x: Math.max(0, (viewWidth - visibleWidth) / 2),
      y: Math.max(0, (viewHeight - visibleHeight) / 2),
    };
  }

  function runtimeHeroPosition() {
    return {
      x: state.heroPositionX + (viewWidth - WIDTH) / 2,
      y: state.heroPositionY + (viewHeight - HEIGHT) / 2,
    };
  }

  function resizeCanvas() {
    const bounds = canvas.getBoundingClientRect();
    updateViewGeometry(bounds);
    const cssPixels = Math.max(1, bounds.width * bounds.height);
    const budgetDpr = Math.sqrt(MAX_CANVAS_PIXELS / cssPixels);
    const dpr = Math.min(window.devicePixelRatio || 1, budgetDpr, 2);
    const width = Math.max(1, Math.round(bounds.width * dpr));
    const height = Math.max(1, Math.round(bounds.height * dpr));
    if (canvas.width !== width) canvas.width = width;
    if (canvas.height !== height) canvas.height = height;
  }

  function measureGlyphs(
    glyphs,
    textSize = state.textSize,
    characterSpacing = state.characterSpacing,
    fontWeight = state.fontWeight,
  ) {
    context.save();
    context.setTransform(1, 0, 0, 1, 0, 0);
    context.font = `${fontWeight} ${textSize}px ${FONT_STACK}`;
    const widths = glyphs.map((glyph) => context.measureText(glyph).width);
    context.restore();
    const offsets = [];
    let cursor = 0;
    widths.forEach((width, index) => {
      offsets.push(cursor + width / 2);
      cursor += width;
      if (index < widths.length - 1) cursor += characterSpacing;
    });
    return { widths, offsets, width: cursor };
  }

  function measureSource() {
    return measureGridGlyphs(sourceGlyphs);
  }

  function measureGridGlyphs(glyphs) {
    const key = `${state.fontWeight}:${state.textSize}:${state.characterSpacing}:${JSON.stringify(glyphs)}`;
    if (gridMeasurementCache.has(key)) {
      return gridMeasurementCache.get(key);
    }
    const measurement = measureGlyphs(glyphs);
    if (gridMeasurementCache.size >= 512) gridMeasurementCache.clear();
    gridMeasurementCache.set(key, measurement);
    return measurement;
  }

  function buildLayout() {
    const sourceMeasurement = measureSource();
    const sourceRecords = [
      {
        glyphs: sourceGlyphs,
        measurement: sourceMeasurement,
        slotWidth: sourceMeasurement.width,
      },
    ];
    const averageSlotWidth =
      sourceRecords.reduce((total, record) => total + record.slotWidth, 0) /
      sourceRecords.length;
    const columnPitch = Math.max(1, averageSlotWidth + state.columnSpacing);
    const rowPitch = Math.max(1, state.textSize + state.rowSpacing);
    const baseColumns = Math.max(1, Math.round(state.columns));
    const baseRows = Math.max(1, Math.round(state.rows));
    const renderedWidth = canvas.getBoundingClientRect().width;
    const columns =
      activeFormat === "desktop"
        ? Math.max(1, Math.round((renderedWidth / WIDTH) * baseColumns))
        : baseColumns +
          Math.max(0, Math.floor((viewWidth - WIDTH) / columnPitch));
    const rows =
      baseRows + Math.max(0, Math.floor((viewHeight - HEIGHT) / rowPitch));
    const nextTopology = `${columns}:${rows}`;
    if (layoutTopology !== null && layoutTopology !== nextTopology) {
      clearWakeReplacementActivity();
      trail.length = 0;
      sectionShuffleMaskCache.clear();
    }
    layoutTopology = nextTopology;
    const columnLayouts = Array.from({ length: columns }, (_, column) => {
      const record = sourceRecords[column % sourceRecords.length];
      return { column, ...record, x: 0, centerX: 0 };
    });
    const occupiedWidth =
      columnLayouts.reduce((total, column) => total + column.slotWidth, 0) +
      Math.max(0, columns - 1) * state.columnSpacing;
    const occupiedHeight =
      rows * state.textSize + Math.max(0, rows - 1) * state.rowSpacing;
    const startX = (viewWidth - occupiedWidth) / 2;
    const startY = (viewHeight - occupiedHeight) / 2 + state.textSize / 2;
    let columnCursor = startX;
    columnLayouts.forEach((column) => {
      column.x = columnCursor;
      column.centerX = columnCursor + column.slotWidth / 2;
      columnCursor += column.slotWidth + state.columnSpacing;
    });
    const baseCellCount = baseColumns * baseRows;
    const sectionCount = Math.min(
      columns * rows,
      Math.max(
        1,
        Math.round(
          state.sectionCount * ((columns * rows) / baseCellCount),
        ),
      ),
    );
    const seedCells = Array.from(
      { length: columns * rows },
      (_, cellIndex) => ({
        cellIndex,
        rank: hash(cellIndex, 0, 101, state.patternSeed),
      }),
    )
      .sort((first, second) => first.rank - second.rank)
      .slice(0, sectionCount);
    const sections = seedCells.map(({ cellIndex }, index) => {
      const row = Math.floor(cellIndex / columns);
      const column = cellIndex % columns;
      const columnLayout = columnLayouts[column];
      return {
        index,
        seedCellIndex: cellIndex,
        x: columnLayout.centerX,
        y: startY + row * rowPitch,
        order: hash(index, 0, 103, state.patternSeed),
      };
    });
    const forcedSections = new Map(
      sections.map((section) => [section.seedCellIndex, section]),
    );
    const orderedSections = [...sections].sort(
      (first, second) => first.order - second.order,
    );
    const sectionRank = new Map(
      orderedSections.map((section, rank) => [section.index, rank]),
    );
    const cells = [];
    let cellIndex = 0;
    for (let row = 0; row < rows; row += 1) {
      for (let column = 0; column < columns; column += 1) {
        const columnLayout = columnLayouts[column];
        const x = columnLayout.x;
        const y = startY + row * rowPitch;
        let closestSection = forcedSections.get(cellIndex);
        if (!closestSection) {
          let closestDistance = Infinity;
          sections.forEach((section) => {
            const dx = (columnLayout.centerX - section.x) / viewWidth;
            const dy = (y - section.y) / viewHeight;
            const wobble =
              (hash(row, column, section.index + 300, state.patternSeed) - 0.5) *
              0.004;
            const distance = dx * dx + dy * dy + wobble;
            if (distance < closestDistance) {
              closestDistance = distance;
              closestSection = section;
            }
          });
        }
        cells.push({
          index: cellIndex,
          row,
          column,
          x,
          y,
          slotWidth: columnLayout.slotWidth,
          baseGlyphs: columnLayout.glyphs,
          baseMeasurement: columnLayout.measurement,
          sectionIndex: closestSection.index,
          sectionRank: sectionRank.get(closestSection.index) ?? 0,
          localDelay: hash(row, column, 401, state.patternSeed),
        });
        cellIndex += 1;
      }
    }
    layoutCache = {
      measurement: sourceMeasurement,
      sourceMeasurement,
      columnLayouts,
      columns,
      rows,
      cells,
      sectionCount,
    };
    wakeStates.clear();
    return layoutCache;
  }

  function layout() {
    return layoutCache ?? buildLayout();
  }

  function randomMaskFor(generation, glyphIds) {
    const selectedCount = Math.round(glyphIds.length * state.randomAmount);
    const key = `${generation}:${glyphIds.length}:${selectedCount}:${state.patternSeed}:${replacementRevision}`;
    if (randomMaskCache.key === key) return randomMaskCache.mask;
    if (selectedCount <= 0) {
      randomMaskCache = { key, mask: new Set() };
      return randomMaskCache.mask;
    }
    const ranked = glyphIds.map((id) => ({
      id,
      rank: hash(id, generation, 500, state.patternSeed),
    })).sort((first, second) => first.rank - second.rank);
    randomMaskCache = {
      key,
      mask: new Set(ranked.slice(0, selectedCount).map((item) => item.id)),
    };
    return randomMaskCache.mask;
  }

  function randomGlyphFor(id, generation, original, randomMask) {
    if (!randomGlyphs.length || !randomMask.has(id)) return original;
    let index = Math.floor(
      hash(id, generation, 502, state.patternSeed) * randomGlyphs.length,
    );
    index = Math.min(randomGlyphs.length - 1, index);
    if (randomGlyphs.length > 1 && randomGlyphs[index] === original) {
      index = (index + 1) % randomGlyphs.length;
    }
    return randomGlyphs[index] ?? original;
  }

  function sectionShuffleMask(generation, sectionCount) {
    if (
      generation < 0 ||
      state.sectionShuffleAmount <= 0 ||
      sectionCount <= 0
    ) {
      return new Set();
    }
    const selectedCount = clamp(
      Math.round(sectionCount * state.sectionShuffleAmount),
      0,
      sectionCount,
    );
    const key = `${generation}:${sectionCount}:${selectedCount}:${state.patternSeed}`;
    if (sectionShuffleMaskCache.has(key)) {
      return sectionShuffleMaskCache.get(key);
    }
    const ranked = Array.from({ length: sectionCount }, (_, index) => ({
      index,
      rank: hash(index, generation, 551, state.patternSeed),
    })).sort((first, second) => first.rank - second.rank);
    const mask = new Set(
      ranked.slice(0, selectedCount).map((item) => item.index),
    );
    sectionShuffleMaskCache.set(key, mask);
    if (sectionShuffleMaskCache.size > 8) {
      sectionShuffleMaskCache.delete(sectionShuffleMaskCache.keys().next().value);
    }
    return mask;
  }

  function replacementPool() {
    const pool = [];
    for (let index = 1; index <= 8; index += 1) {
      const glyphs = splitGraphemes(state[`replacementString${index}`] || "")
        .slice(0, 144);
      if (glyphs.length) pool.push(glyphs);
    }
    return pool;
  }

  function replacementPaddingGlyphs(count, wordId, sequence, salt) {
    return Array.from({ length: count }, (_, index) => {
      if (!state.padReplacementStrings) return "";
      const poolIndex = Math.min(
        paddingGlyphs.length - 1,
        Math.floor(
          hash(
            wordId * GLYPH_ID_STRIDE + index,
            sequence,
            salt,
            state.patternSeed,
          ) * paddingGlyphs.length,
        ),
      );
      return paddingGlyphs[poolIndex] ?? "░";
    });
  }

  function fitReplacementGlyphs(
    glyphs,
    wordId,
    sequence,
    targetLength = sourceGlyphs.length,
  ) {
    targetLength = Math.max(1, targetLength);
    if (glyphs.length >= targetLength) {
      const start = Math.floor((glyphs.length - targetLength) / 2);
      return glyphs.slice(start, start + targetLength);
    }

    const missing = targetLength - glyphs.length;
    const leftCount = Math.floor(missing / 2);
    const rightCount = missing - leftCount;
    return [
      ...replacementPaddingGlyphs(leftCount, wordId, sequence, 709),
      ...glyphs,
      ...replacementPaddingGlyphs(rightCount, wordId, sequence, 719),
    ];
  }

  function replacementPlanFor(glyphs, wordId, sequence) {
    const data = layout();
    const anchor = data.cells[wordId];
    if (!anchor || anchor.index !== wordId) return null;
    const anchorLength = Math.max(1, anchor.baseGlyphs.length);
    if (!state.flowLongStringsEnabled || glyphs.length <= anchorLength) {
      return {
        chunks: [
          fitReplacementGlyphs(
            glyphs,
            wordId,
            sequence,
            anchorLength,
          ),
        ],
        cellIds: [wordId],
      };
    }

    const maximumCells = Math.max(1, Math.round(state.flowMaxCells));
    const candidateCells = data.cells.slice(wordId, wordId + maximumCells);
    if (!candidateCells.length) return null;
    const maximumGlyphs = candidateCells.reduce(
      (total, cell) => total + Math.max(1, cell.baseGlyphs.length),
      0,
    );
    const cappedGlyphs = glyphs.slice(0, maximumGlyphs);
    const chunks = [];
    const cellIds = [];
    let glyphIndex = 0;
    for (const cell of candidateCells) {
      if (glyphIndex >= cappedGlyphs.length) break;
      const targetLength = Math.max(1, cell.baseGlyphs.length);
      const chunk = cappedGlyphs.slice(
        glyphIndex,
        glyphIndex + targetLength,
      );
      glyphIndex += chunk.length;
      if (chunk.length < targetLength) {
        chunk.push(
          ...replacementPaddingGlyphs(
            targetLength - chunk.length,
            cell.index,
            sequence,
            733,
          ),
        );
      }
      chunks.push(chunk);
      cellIds.push(cell.index);
    }
    if (!chunks.length) return null;
    if (
      !state.flowWrapRows &&
      anchor.column + chunks.length > data.columns
    ) {
      return null;
    }
    return { chunks, cellIds };
  }

  function replacementRequestLifetime() {
    const returnDuration =
      state.afterWakeStringDuration +
      RETURN_STAGGER_DURATION * state.returnCharacterRandomness;
    return (
      Math.max(returnDuration, state.postWakeColorDuration) +
      state.wakeDuration +
      state.heroCascadeDuration +
      1
    );
  }

  function estimatedReplacementReleaseAt(replacement) {
    if (!replacement) return 0;
    const holdStartAt = replacement.holdStartAt ?? replacement.assignedAt;
    return Math.max(
      holdStartAt +
        state.afterWakeStringDuration +
        RETURN_STAGGER_DURATION * state.returnCharacterRandomness,
      holdStartAt + state.postWakeColorDuration,
    );
  }

  function orderedReplacementPlans(wordId, sequence, pool) {
    const plans = [];
    if (!pool.length) return plans;
    const startingIndex = Math.min(
      pool.length - 1,
      Math.floor(
        hash(wordId, sequence, 701, state.patternSeed) * pool.length,
      ),
    );
    for (let offset = 0; offset < pool.length; offset += 1) {
      const poolIndex = (startingIndex + offset) % pool.length;
      const plan = replacementPlanFor(
        pool[poolIndex],
        wordId,
        sequence,
      );
      if (!plan) continue;
      plans.push({
        ...plan,
        poolIndex,
        text: plan.chunks.flat().join(""),
      });
    }
    return plans;
  }

  function earlierRequestDeadline(cellId, sequence) {
    let deadline = 0;
    const pending = pendingWordReplacements.get(cellId);
    if (pending && pending.sequence < sequence) {
      deadline = Math.max(deadline, pending.expiresAt);
    }
    const scheduled = scheduledPulseReplacements.get(cellId);
    if (scheduled && scheduled.sequence < sequence) {
      deadline = Math.max(deadline, scheduled.expiresAt);
    }
    const planned = plannedCellClaims.get(cellId);
    if (planned && planned.sequence < sequence) {
      const plannedRequest = scheduledPulseReplacements.get(
        planned.anchorId,
      );
      deadline = Math.max(
        deadline,
        plannedRequest?.expiresAt ?? 0,
      );
    }
    return deadline;
  }

  function flowCellAvailability(cellIds, sequence, time) {
    let available = true;
    let blockedUntil = 0;
    cellIds.forEach((cellId) => {
      const claim = cellClaims.get(cellId);
      if (claim) {
        available = false;
        const estimatedReleaseAt = estimatedReplacementReleaseAt(
          wordReplacements.get(claim.anchorId),
        );
        blockedUntil = Math.max(
          blockedUntil,
          estimatedReleaseAt > 0
            ? Math.max(
                estimatedReleaseAt,
                time + FLOW_REQUEST_RETRY_DELAY * 2,
              )
            : time + replacementRequestLifetime(),
        );
      }
      const earlierDeadline = earlierRequestDeadline(cellId, sequence);
      if (earlierDeadline > 0) {
        available = false;
        blockedUntil = Math.max(blockedUntil, earlierDeadline);
      }
    });
    return { available, blockedUntil };
  }

  function releasePlannedRequest(request) {
    request.plan?.cellIds.forEach((cellId) => {
      const planned = plannedCellClaims.get(cellId);
      if (
        planned?.anchorId === request.wordId &&
        planned.sequence === request.sequence
      ) {
        plannedCellClaims.delete(cellId);
      }
    });
  }

  function queueWordReplacement(wordId, endTime) {
    const pending = pendingWordReplacements.get(wordId);
    if (pending) {
      pending.readyAt = Math.max(pending.readyAt, endTime);
      pending.nextAttempt = Math.max(pending.nextAttempt, endTime);
      pending.expiresAt = Math.max(
        pending.expiresAt,
        endTime + replacementRequestLifetime(),
      );
      return;
    }
    wakeSequence += 1;
    pendingWordReplacements.set(wordId, {
      wordId,
      readyAt: endTime,
      nextAttempt: endTime,
      expiresAt: endTime + replacementRequestLifetime(),
      sequence: wakeSequence,
    });
  }

  function assignWordReplacement(wordId, assignedAt, request, pool) {
    const sequence = request.sequence;
    const plans = request.plan
      ? [request.plan]
      : orderedReplacementPlans(wordId, sequence, pool);
    let blockedUntil = 0;
    for (const plan of plans) {
      const availability = flowCellAvailability(
        plan.cellIds,
        sequence,
        assignedAt,
      );
      blockedUntil = Math.max(
        blockedUntil,
        availability.blockedUntil,
      );
      if (!availability.available) continue;
      const chunkArrivalTimes = plan.chunkArrivalTimes
        ? plan.chunkArrivalTimes.map((arrivalAt) =>
            Math.max(arrivalAt, assignedAt),
          )
        : plan.chunks.map(() => assignedAt);
      const holdStartAt = Math.max(...chunkArrivalTimes, assignedAt);
      const replacement = {
        glyphs: plan.chunks[0],
        chunks: plan.chunks,
        cellIds: plan.cellIds,
        text: plan.text,
        poolIndex: plan.poolIndex,
        assignedAt,
        chunkArrivalTimes,
        holdStartAt,
        sequence,
      };
      wordReplacements.set(wordId, replacement);
      releasePlannedRequest(request);
      plan.cellIds.forEach((cellId, chunkIndex) => {
        cellClaims.set(cellId, { anchorId: wordId, chunkIndex });
      });
      return { assigned: true, blockedUntil: 0 };
    }
    return { assigned: false, blockedUntil };
  }

  function finalizeDueReplacementRequests(time) {
    if (
      !pendingWordReplacements.size &&
      !scheduledPulseReplacements.size
    ) {
      return;
    }
    const pool = replacementPool();
    const due = [];
    pendingWordReplacements.forEach((request, wordId) => {
      if (time >= request.nextAttempt) {
        due.push({ map: pendingWordReplacements, request, wordId });
      }
    });
    scheduledPulseReplacements.forEach((request, wordId) => {
      if (time >= request.nextAttempt) {
        due.push({ map: scheduledPulseReplacements, request, wordId });
      }
    });
    due.sort(
      (first, second) =>
        first.request.sequence - second.request.sequence ||
        first.wordId - second.wordId,
    );
    let changed = false;
    due.forEach(({ map, request, wordId }) => {
      if (map.get(wordId) !== request) return;
      const result = assignWordReplacement(wordId, time, request, pool);
      if (result.assigned) {
        map.delete(wordId);
        changed = true;
        return;
      }
      if (result.blockedUntil > time) {
        request.expiresAt = Math.max(
          request.expiresAt,
          result.blockedUntil + FLOW_REQUEST_RETRY_DELAY * 2,
        );
      }
      if ((!pool.length && !request.plan) || time >= request.expiresAt) {
        releasePlannedRequest(request);
        map.delete(wordId);
        return;
      }
      request.nextAttempt = time + FLOW_REQUEST_RETRY_DELAY;
    });
    if (changed) {
      replacementRevision += 1;
      randomMaskCache = { key: "", mask: new Set() };
    }
  }

  function schedulePulsePostWakeWords(data, time, blockedCellIds) {
    const totalWords = data.cells.length;
    const targetCount = clamp(
      Math.round(totalWords * state.heroIdlePostWakeAmount),
      0,
      totalWords,
    );
    const committedCells = new Set([
      ...cellClaims.keys(),
      ...plannedCellClaims.keys(),
    ]);
    let remainingCellBudget = Math.max(
      0,
      targetCount - committedCells.size,
    );
    const pool = replacementPool();
    if (!remainingCellBudget || !pool.length) return;

    heroRuntime.pulseReplacementGeneration += 1;
    const generation = heroRuntime.pulseReplacementGeneration;
    const unavailableCells = new Set([
      ...blockedCellIds,
      ...committedCells,
    ]);
    const candidates = data.cells
      .filter(
        (cell) =>
          !unavailableCells.has(cell.index) &&
          !pendingWordReplacements.has(cell.index) &&
          !scheduledPulseReplacements.has(cell.index),
      )
      .map((cell) => ({
        cell,
        rank: hash(cell.index, generation, 739, state.patternSeed),
      }))
      .sort((first, second) => first.rank - second.rank);
    const heroPosition = runtimeHeroPosition();
    for (const { cell } of candidates) {
      if (remainingCellBudget <= 0) break;
      const sequence = wakeSequence + 1;
      const viablePlans = orderedReplacementPlans(
        cell.index,
        sequence,
        pool,
      ).filter((plan) =>
        plan.cellIds.every(
          (cellId) =>
            !unavailableCells.has(cellId) &&
            earlierRequestDeadline(cellId, sequence) <= 0,
        ),
      );
      if (!viablePlans.length) continue;
      const planWithinBudget = viablePlans.find(
        (plan) => plan.cellIds.length <= remainingCellBudget,
      );
      if (!planWithinBudget) continue;
      const plan = planWithinBudget;
      const chunkArrivalTimes = plan.cellIds.map((cellId) => {
        const targetCell = data.cells[cellId];
        const x = targetCell.x + targetCell.slotWidth / 2;
        return (
          time +
          glyphPulseArrivalDelay(
            x,
            targetCell.y,
            heroPosition.x,
            heroPosition.y,
            state.heroCascadeDuration,
          )
        );
      });
      const planned = { ...plan, chunkArrivalTimes };
      const firstArrivalAt = Math.min(...chunkArrivalTimes);
      const lastArrivalAt = Math.max(...chunkArrivalTimes);
      wakeSequence = sequence;
      const request = {
        wordId: cell.index,
        readyAt: firstArrivalAt,
        nextAttempt: firstArrivalAt,
        expiresAt: lastArrivalAt + replacementRequestLifetime(),
        sequence,
        plan: planned,
      };
      scheduledPulseReplacements.set(cell.index, request);
      plan.cellIds.forEach((cellId) => {
        plannedCellClaims.set(cellId, {
          anchorId: cell.index,
          sequence,
        });
        unavailableCells.add(cellId);
      });
      remainingCellBudget -= plan.cellIds.length;
    }
  }

  function returnDelayFor(wordId, characterIndex, replacement) {
    return (
      hash(
        wordId * GLYPH_ID_STRIDE + characterIndex,
        replacement.sequence,
        727,
        state.patternSeed,
      ) *
      RETURN_STAGGER_DURATION *
      state.returnCharacterRandomness
    );
  }

  function returningGlyphFor(
    cellId,
    characterIndex,
    replacement,
    chunkGlyphs,
    returnElapsed,
    baseGlyphs,
  ) {
    const sourceGlyph = baseGlyphs[characterIndex] ?? "";
    const replacementGlyph = chunkGlyphs[characterIndex] ?? "";
    const delay = returnDelayFor(cellId, characterIndex, replacement);
    return returnElapsed < delay ? replacementGlyph : sourceGlyph;
  }

  function replacementChunkArrivalAt(replacement, chunkIndex) {
    return (
      replacement?.chunkArrivalTimes?.[chunkIndex] ??
      replacement?.assignedAt ??
      Infinity
    );
  }

  function replacementChunkHasArrived(replacement, chunkIndex, time) {
    return time >= replacementChunkArrivalAt(replacement, chunkIndex);
  }

  function arrivedClaimCellCount(time) {
    let count = 0;
    cellClaims.forEach((claim) => {
      const replacement = wordReplacements.get(claim.anchorId);
      if (
        replacementChunkHasArrived(
          replacement,
          claim.chunkIndex,
          time,
        )
      ) {
        count += 1;
      }
    });
    return count;
  }

  function displayGlyphsForCell(cell, replacement, chunkIndex, time) {
    const baseGlyphs = cell?.baseGlyphs?.length
      ? cell.baseGlyphs
      : sourceGlyphs;
    if (!replacement) return baseGlyphs;
    if (!replacementChunkHasArrived(replacement, chunkIndex, time)) {
      return baseGlyphs;
    }
    const chunkGlyphs = replacement.chunks[chunkIndex] ?? baseGlyphs;
    const returnElapsed =
      time - (replacement.holdStartAt + state.afterWakeStringDuration);
    if (returnElapsed < 0) return chunkGlyphs;
    const glyphCount = Math.max(baseGlyphs.length, chunkGlyphs.length);
    return Array.from({ length: glyphCount }, (_, characterIndex) =>
      returningGlyphFor(
        cell.index,
        characterIndex,
        replacement,
        chunkGlyphs,
        returnElapsed,
        baseGlyphs,
      ),
    );
  }

  function retireCompletedWordReplacements(time) {
    let changed = false;
    const data = layout();
    wordReplacements.forEach((replacement, wordId) => {
      let maximumDelay = 0;
      replacement.cellIds.forEach((cellId, chunkIndex) => {
        const baseGlyphs = data.cells[cellId]?.baseGlyphs ?? sourceGlyphs;
        const chunkGlyphs = replacement.chunks[chunkIndex] ?? [];
        const glyphCount = Math.max(baseGlyphs.length, chunkGlyphs.length);
        for (let characterIndex = 0; characterIndex < glyphCount; characterIndex += 1) {
          maximumDelay = Math.max(
            maximumDelay,
            returnDelayFor(cellId, characterIndex, replacement),
          );
        }
      });
      const returnEnd =
        replacement.holdStartAt +
        state.afterWakeStringDuration +
        maximumDelay;
      const colorEnd =
        replacement.holdStartAt + state.postWakeColorDuration;
      if (time < Math.max(returnEnd, colorEnd)) return;
      wordReplacements.delete(wordId);
      replacement.cellIds.forEach((cellId) => {
        const claim = cellClaims.get(cellId);
        if (claim?.anchorId === wordId) cellClaims.delete(cellId);
      });
      changed = true;
    });
    if (changed) {
      replacementRevision += 1;
      randomMaskCache = { key: "", mask: new Set() };
    }
  }

  function resetHeroRuntime(idleSince = 0, { resetSequence = false } = {}) {
    const nextTextIndex = resetSequence ? 0 : heroRuntime.nextTextIndex;
    heroRuntime.active = false;
    heroRuntime.persistent = false;
    heroRuntime.phase = "idle";
    heroRuntime.armed = true;
    heroRuntime.startedAt = 0;
    heroRuntime.endedAt = 0;
    heroRuntime.returning = false;
    heroRuntime.currentText = "";
    heroRuntime.nextTextIndex = nextTextIndex;
    heroRuntime.idleSince = idleSince;
    heroRuntime.triggerSource = null;
    heroRuntime.durationTier = "discrete";
    heroRuntime.introHeroesRemaining = 0;
    heroRuntime.keepRoomOpen = false;
    heroRuntime.pulseStartedAt = null;
    heroRuntime.pulseReplacementGeneration = 0;
    heroRuntime.pulseReplacementSchedulePending = false;
    heroRuntime.rolloverHoveredCharacterIndex = -1;
    heroRuntime.rolloverCascadeStarts.clear();
  }

  function heroStringPool() {
    return HERO_TEXT_KEYS.map((key) =>
      splitGraphemes(state[key] || "").slice(0, 48).join(""),
    ).filter((text) => splitGraphemes(text).some((glyph) => glyph.trim()));
  }

  function sectionRevealAt(cell, data, populateDuration) {
    const sectionPosition =
      data.sectionCount > 1
        ? cell.sectionRank / (data.sectionCount - 1)
        : 0;
    return (
      0.08 +
      sectionPosition * populateDuration * 0.76 +
      cell.localDelay * populateDuration * 0.12
    );
  }

  function sectionIntroEndAt(data, populateDuration) {
    return data.cells.reduce(
      (latest, cell) =>
        Math.max(
          latest,
          sectionRevealAt(cell, data, populateDuration) +
            state.fadeInDuration,
        ),
      0,
    );
  }

  function startHero(
    time,
    stringPool,
    triggerSource,
    {
      keepRoomOpen = false,
      phase = "standard",
      schedulePulse = true,
      preservePulse = false,
      durationTier = "discrete",
    } = {},
  ) {
    if (!stringPool.length) return false;
    const stringIndex = heroRuntime.nextTextIndex % stringPool.length;
    heroRuntime.currentText = stringPool[stringIndex];
    heroRuntime.nextTextIndex = (stringIndex + 1) % stringPool.length;
    heroRuntime.active = true;
    heroRuntime.persistent = false;
    heroRuntime.phase = phase;
    heroRuntime.returning = false;
    heroRuntime.armed = false;
    heroRuntime.startedAt = time;
    heroRuntime.endedAt = 0;
    heroRuntime.triggerSource = triggerSource;
    heroRuntime.durationTier = durationTier;
    heroRuntime.keepRoomOpen = keepRoomOpen;
    heroRuntime.rolloverHoveredCharacterIndex = -1;
    heroRuntime.rolloverCascadeStarts.clear();
    if (!preservePulse) {
      heroRuntime.pulseStartedAt = schedulePulse ? time : null;
      heroRuntime.pulseReplacementSchedulePending = schedulePulse;
    } else if (schedulePulse) {
      heroRuntime.pulseStartedAt = time;
      heroRuntime.pulseReplacementSchedulePending = true;
    }
    return true;
  }

  function beginPersistentHeroSwap(time, triggerSource) {
    if (!heroRuntime.persistent) return false;
    const schedulePulse = triggerSource === "wake";
    heroRuntime.active = true;
    heroRuntime.persistent = false;
    heroRuntime.phase = "persistent-exit";
    heroRuntime.armed = false;
    heroRuntime.startedAt = time;
    heroRuntime.endedAt = 0;
    heroRuntime.returning = false;
    heroRuntime.triggerSource = triggerSource;
    heroRuntime.keepRoomOpen = true;
    heroRuntime.pulseStartedAt = schedulePulse ? time : null;
    heroRuntime.pulseReplacementSchedulePending = schedulePulse;
    return true;
  }

  function heroHoldDurationForCurrentHeadline() {
    if (!state.continuousHeadlinesEnabled) return state.heroHoldDuration;
    return heroRuntime.durationTier === "subsequent"
      ? state.continuousSubsequentDuration
      : state.continuousInitialDuration;
  }

  function heroLineHandoffOverlap() {
    return state.heroCascadeDuration * state.heroTransitionOverlap;
  }

  function heroPresentationFor(time, data) {
    const totalWords = data.cells.length;
    const heroPosition = runtimeHeroPosition();
    const stringPool = heroStringPool();
    if (totalWords <= 0 || !stringPool.length) {
      resetHeroRuntime(time);
      return null;
    }

    // Weight the trigger by arrived cells rather than anchor words. Future
    // chunks in a pulse-planned flow do not count until the pulse reaches them.
    const postWakeRatio = arrivedClaimCellCount(time) / totalWords;
    const triggerAmount = state.heroTriggerAmount;
    const headlineHoldDuration = heroHoldDurationForCurrentHeadline();
    const totalDuration =
      state.heroCascadeDuration * 2 + headlineHoldDuration;
    const populateDuration = state.populateDuration / state.revealSpeed;
    const introEnd = sectionIntroEndAt(data, populateDuration);
    if (heroRuntime.active) {
      const phaseElapsed = time - heroRuntime.startedAt;
      if (
        heroRuntime.phase === "persistent-enter" &&
        phaseElapsed >= state.heroCascadeDuration
      ) {
        const completedAt =
          heroRuntime.startedAt + state.heroCascadeDuration;
        heroRuntime.active = false;
        heroRuntime.persistent = true;
        heroRuntime.phase = "persistent";
        heroRuntime.idleSince = completedAt;
        heroRuntime.keepRoomOpen = true;
      } else if (
        heroRuntime.phase === "persistent-exit" &&
        phaseElapsed >= state.heroCascadeDuration
      ) {
        const completedAt =
          heroRuntime.startedAt + state.heroCascadeDuration;
        startHero(
          completedAt - heroLineHandoffOverlap(),
          stringPool,
          heroRuntime.triggerSource,
          {
            keepRoomOpen: true,
            phase: "persistent-enter",
            schedulePulse: false,
            preservePulse: true,
            durationTier: "subsequent",
          },
        );
      } else if (
        heroRuntime.phase === "standard" &&
        phaseElapsed >= totalDuration
      ) {
        const completedAt = heroRuntime.startedAt + totalDuration;
        if (
          heroRuntime.triggerSource === "intro" &&
          heroRuntime.introHeroesRemaining > 0
        ) {
          heroRuntime.introHeroesRemaining -= 1;
          const finalOpeningHeadline =
            state.continuousHeadlinesEnabled &&
            heroRuntime.introHeroesRemaining === 0;
          if (finalOpeningHeadline) {
            // Return to the sole configured string before locking the
            // headline on screen.
            heroRuntime.nextTextIndex = 0;
          }
          startHero(
            completedAt - heroLineHandoffOverlap(),
            stringPool,
            "intro",
            {
              keepRoomOpen: true,
              phase: finalOpeningHeadline
                ? "persistent-enter"
                : "standard",
              // The first entrance owns the opening pulse; any recovered
              // legacy handoff remains typographic only.
              schedulePulse: false,
              durationTier: "initial",
            },
          );
        } else if (state.continuousHeadlinesEnabled) {
          // A one-string pool still becomes persistent rather than briefly
          // rebuilding the grid between idle cycles.
          heroRuntime.active = false;
          heroRuntime.persistent = true;
          heroRuntime.phase = "persistent";
          heroRuntime.idleSince = completedAt;
          heroRuntime.keepRoomOpen = true;
        } else {
          heroRuntime.active = false;
          heroRuntime.returning = true;
          heroRuntime.phase = "returning";
          heroRuntime.endedAt = completedAt;
        }
      }
    }
    if (
      heroRuntime.returning &&
      time - heroRuntime.endedAt >=
        state.fadeInDuration +
          (Math.round(state.heroReturnSubsections) > 1
            ? state.heroReturnStagger
            : 0) -
          0.000001
    ) {
      heroRuntime.returning = false;
      heroRuntime.phase = "idle";
      heroRuntime.idleSince = time;
    }

    if (
      !heroRuntime.active &&
      !heroRuntime.returning &&
      !heroRuntime.persistent
    ) {
      if (introHeroPending) {
        if (time >= introEnd) {
          introHeroPending = false;
          const introHeroCount = 1;
          heroRuntime.introHeroesRemaining = Math.max(
            0,
            introHeroCount - 1,
          );
          startHero(time, stringPool, "intro", {
            phase:
              state.continuousHeadlinesEnabled &&
              heroRuntime.introHeroesRemaining === 0
                ? "persistent-enter"
                : "standard",
            durationTier: state.continuousHeadlinesEnabled
              ? "initial"
              : "discrete",
          });
        }
      } else {
        const rearmAmount = Math.max(0, triggerAmount - 0.02);
        if (postWakeRatio < rearmAmount) heroRuntime.armed = true;
        const wakeReady = heroRuntime.armed && postWakeRatio >= triggerAmount;
        const idleReady =
          !REDUCED_MOTION &&
          pageVisible &&
          canvasVisible &&
          time - heroRuntime.idleSince >= state.heroIdleDelay;
        if (wakeReady) {
          startHero(time, stringPool, "wake", {
            durationTier: state.continuousHeadlinesEnabled
              ? "subsequent"
              : "discrete",
          });
        } else if (idleReady) {
          startHero(time, stringPool, "idle", {
            durationTier: state.continuousHeadlinesEnabled
              ? "subsequent"
              : "discrete",
          });
        }
      }
    }
    if (heroRuntime.persistent) {
      // Once the opening cascade completes, the configured headline is the
      // permanent resting state. Pointer rollover supplies the only ongoing
      // character motion; idle time and grid wakes do not replace it.
      heroRuntime.armed = false;
    }
    if (
      !heroRuntime.active &&
      !heroRuntime.returning &&
      !heroRuntime.persistent
    ) {
      return null;
    }

    const glyphs = splitGraphemes(heroRuntime.currentText).slice(0, 48);
    if (!glyphs.length) {
      heroRuntime.active = false;
      heroRuntime.persistent = false;
      heroRuntime.returning = false;
      heroRuntime.phase = "idle";
      heroRuntime.idleSince = time;
      return null;
    }

    const cascadeDuration = state.heroCascadeDuration;
    const outroStart = cascadeDuration + headlineHoldDuration;
    const phaseElapsed = Math.max(0, time - heroRuntime.startedAt);
    const age = heroRuntime.returning
      ? totalDuration
      : heroRuntime.phase === "persistent-exit"
        ? outroStart + phaseElapsed
        : heroRuntime.persistent
          ? cascadeDuration + Math.max(0, time - heroRuntime.idleSince)
          : phaseElapsed;
    const exitElapsed =
      heroRuntime.phase === "persistent-exit"
        ? phaseElapsed
        : heroRuntime.phase === "standard" || heroRuntime.returning
          ? age - outroStart
          : -1;
    const roomEnterDuration = Math.min(
      HERO_ROOM_TRANSITION_DURATION,
      cascadeDuration * 0.72,
    );
    const roomEnterProgress = smootherstep(
      age / Math.max(0.04, roomEnterDuration),
    );
    const measurement = measureGlyphs(
      glyphs,
      state.heroTextSize,
      state.heroCharacterSpacing,
      state.heroFontWeight,
    );
    const cursorWidth = measureGlyphs(
      [HERO_CURSOR_GLYPH],
      state.heroTextSize,
      state.heroCharacterSpacing,
      state.heroFontWeight,
    ).width;
    const roomTexts = state.continuousHeadlinesEnabled
      ? stringPool
      : heroRuntime.triggerSource === "intro"
        ? stringPool.slice(0, 1)
        : [heroRuntime.currentText];
    const roomWidth = roomTexts.reduce(
      (maximum, text) =>
        Math.max(
          maximum,
          measureGlyphs(
            splitGraphemes(text).slice(0, 48),
            state.heroTextSize,
            state.heroCharacterSpacing,
            state.heroFontWeight,
          ).width,
        ),
      measurement.width,
    );
    const handoffOverlap = heroLineHandoffOverlap();
    const handoffEligible =
      (heroRuntime.phase === "persistent-exit" && stringPool.length > 1) ||
      (heroRuntime.phase === "standard" &&
        heroRuntime.triggerSource === "intro" &&
        heroRuntime.introHeroesRemaining > 0);
    const handoffAge =
      exitElapsed - (cascadeDuration - handoffOverlap);
    let handoff = null;
    if (handoffEligible && handoffAge >= 0) {
      const returningToFirstHeadline =
        heroRuntime.phase === "standard" &&
        heroRuntime.triggerSource === "intro" &&
        state.continuousHeadlinesEnabled &&
        heroRuntime.introHeroesRemaining === 1;
      const nextTextIndex = returningToFirstHeadline
        ? 0
        : heroRuntime.nextTextIndex % stringPool.length;
      const nextText = stringPool[nextTextIndex] ?? "";
      const nextGlyphs = splitGraphemes(nextText).slice(0, 48);
      if (nextGlyphs.length) {
        const nextMeasurement = measureGlyphs(
          nextGlyphs,
          state.heroTextSize,
          state.heroCharacterSpacing,
          state.heroFontWeight,
        );
        handoff = {
          age: handoffAge,
          cascadeDuration,
          exitElapsed: -1,
          glyphs: nextGlyphs,
          measurement: nextMeasurement,
          cursorWidth: measureGlyphs(
            [HERO_CURSOR_GLYPH],
            state.heroTextSize,
            state.heroCharacterSpacing,
            state.heroFontWeight,
          ).width,
          drawGlyphs: true,
          x: heroPosition.x,
          y: heroPosition.y,
        };
      }
    }
    return {
      age,
      cascadeDuration,
      exitElapsed,
      glyphs,
      measurement,
      cursorWidth,
      roomWidth,
      drawGlyphs: heroRuntime.active || heroRuntime.persistent,
      returning: heroRuntime.returning,
      returnElapsed: heroRuntime.returning
        ? Math.max(0, time - heroRuntime.endedAt)
        : 0,
      roomProgress: heroRuntime.returning
        ? 1
        : heroRuntime.keepRoomOpen || heroRuntime.persistent
          ? 1
          : roomEnterProgress,
      pulseAge:
        heroRuntime.pulseStartedAt === null
          ? null
          : Math.max(0, time - heroRuntime.pulseStartedAt),
      rolloverEnabled:
        heroRuntime.persistent ||
        (heroRuntime.active &&
          heroRuntime.phase === "standard" &&
          age >= cascadeDuration &&
          exitElapsed < 0),
      rolloverTime: time,
      x: heroPosition.x,
      y: heroPosition.y,
      handoff,
    };
  }

  function blockedCellsForHero(data, hero, includeBeforeTransition = false) {
    if (
      !hero ||
      (!includeBeforeTransition && hero.roomProgress <= 0)
    ) {
      return new Set();
    }
    const roomWidth = hero.roomWidth ?? hero.measurement.width;
    const left = hero.x - roomWidth / 2 - state.heroMargin;
    const right =
      hero.x +
      roomWidth / 2 +
      (state.heroCursorEnabled
        ? state.heroCharacterSpacing + hero.cursorWidth
        : 0) +
      state.heroMargin;
    const top = hero.y - state.heroTextSize / 2 - state.heroMargin;
    const bottom = hero.y + state.heroTextSize / 2 + state.heroMargin;
    const blocked = new Set();
    data.cells.forEach((cell) => {
      const cellLeft = cell.x;
      const cellRight = cell.x + cell.slotWidth;
      const cellTop = cell.y - state.textSize * 0.65;
      const cellBottom = cell.y + state.textSize * 0.65;
      if (
        cellRight >= left &&
        cellLeft <= right &&
        cellBottom >= top &&
        cellTop <= bottom
      ) {
        blocked.add(cell.index);
      }
    });
    return blocked;
  }

  function heroReturnGroups(data, blockedCellIds) {
    const blockedCells = data.cells.filter((cell) =>
      blockedCellIds.has(cell.index),
    );
    const groupCount = Math.min(
      blockedCells.length,
      Math.max(1, Math.round(state.heroReturnSubsections)),
    );
    const key = `${[...blockedCellIds]
      .sort((first, second) => first - second)
      .join(",")}:${groupCount}:${state.patternSeed}`;
    if (
      heroReturnGroupCache.layout === data &&
      heroReturnGroupCache.key === key
    ) {
      return heroReturnGroupCache;
    }
    if (!blockedCells.length) {
      heroReturnGroupCache = {
        layout: data,
        key,
        groupByCell: new Map(),
        count: 0,
      };
      return heroReturnGroupCache;
    }

    const minimumX = Math.min(...blockedCells.map((cell) => cell.x));
    const maximumX = Math.max(...blockedCells.map((cell) => cell.x));
    const minimumY = Math.min(...blockedCells.map((cell) => cell.y));
    const maximumY = Math.max(...blockedCells.map((cell) => cell.y));
    const spanX = Math.max(1, maximumX - minimumX);
    const spanY = Math.max(1, maximumY - minimumY);
    const distanceBetween = (first, second) => {
      const dx = (first.x - second.x) / spanX;
      const dy = (first.y - second.y) / spanY;
      return dx * dx + dy * dy;
    };

    const firstSeed = [...blockedCells].sort(
      (first, second) =>
        hash(first.index, 0, 941, state.patternSeed) -
        hash(second.index, 0, 941, state.patternSeed),
    )[0];
    const seeds = [firstSeed];
    const seedIds = new Set([firstSeed.index]);
    while (seeds.length < groupCount) {
      let nextSeed = null;
      let nextDistance = -1;
      blockedCells.forEach((candidate) => {
        if (seedIds.has(candidate.index)) return;
        const nearestDistance = Math.min(
          ...seeds.map((seed) => distanceBetween(candidate, seed)),
        );
        const rankedDistance =
          nearestDistance +
          hash(candidate.index, seeds.length, 943, state.patternSeed) * 1e-7;
        if (rankedDistance > nextDistance) {
          nextDistance = rankedDistance;
          nextSeed = candidate;
        }
      });
      if (!nextSeed) break;
      seeds.push(nextSeed);
      seedIds.add(nextSeed.index);
    }

    const orderedSeedIndexes = seeds
      .map((seed, seedIndex) => ({
        seedIndex,
        order: hash(seed.index, seed.sectionRank, 947, state.patternSeed),
      }))
      .sort((first, second) => first.order - second.order);
    const seedOrder = new Map(
      orderedSeedIndexes.map(({ seedIndex }, order) => [seedIndex, order]),
    );
    const groupByCell = new Map();
    blockedCells.forEach((cell) => {
      let closestSeedIndex = 0;
      let closestDistance = Infinity;
      seeds.forEach((seed, seedIndex) => {
        const distance = distanceBetween(cell, seed);
        if (distance < closestDistance) {
          closestDistance = distance;
          closestSeedIndex = seedIndex;
        }
      });
      groupByCell.set(cell.index, seedOrder.get(closestSeedIndex) ?? 0);
    });
    heroReturnGroupCache = {
      layout: data,
      key,
      groupByCell,
      count: seeds.length,
    };
    return heroReturnGroupCache;
  }

  function heroRoomProgressByCell(data, hero, blockedCellIds) {
    const progressByCell = new Map();
    if (!hero || !blockedCellIds.size) return progressByCell;
    if (!hero.returning) {
      data.cells.forEach((cell) => {
        if (blockedCellIds.has(cell.index)) {
          progressByCell.set(cell.index, hero.roomProgress);
        }
      });
      return progressByCell;
    }

    const groups = heroReturnGroups(data, blockedCellIds);
    const lastGroup = Math.max(1, groups.count - 1);
    groups.groupByCell.forEach((groupIndex, cellIndex) => {
      const delay =
        groups.count > 1
          ? (groupIndex / lastGroup) * state.heroReturnStagger
          : 0;
      const revealProgress = smootherstep(
        (hero.returnElapsed - delay) / state.fadeInDuration,
      );
      progressByCell.set(cellIndex, 1 - revealProgress);
    });
    return progressByCell;
  }

  function glyphPulseMetrics(centerX, centerY, cascadeDuration) {
    const totalHeroDuration =
      cascadeDuration * 2 + heroHoldDurationForCurrentHeadline();
    const pulseDuration = Math.min(
      clamp(cascadeDuration * 1.35, 1, 2.4) / state.glyphPulseSpeed,
      Math.max(0.2, totalHeroDuration - 0.01),
    );
    const farthestX = Math.max(centerX, viewWidth - centerX);
    const farthestY = Math.max(centerY, viewHeight - centerY);
    return {
      maximumRadius: Math.max(1, Math.hypot(farthestX, farthestY)),
      halfWidth: clamp(state.wakeSpread, 56, 140),
      pulseDuration,
    };
  }

  function glyphPulseArrivalDelay(
    x,
    y,
    centerX,
    centerY,
    cascadeDuration,
  ) {
    const { maximumRadius, halfWidth, pulseDuration } = glyphPulseMetrics(
      centerX,
      centerY,
      cascadeDuration,
    );
    const distance = Math.hypot(x - centerX, y - centerY);
    const travelDistance = maximumRadius + halfWidth * 2;
    const arrivalProgress = clamp(
      (distance + halfWidth) / travelDistance,
      0,
      1,
    );
    return pulseDuration * arrivalProgress;
  }

  function heroColorPulseAt(x, y, hero) {
    if (!hero || hero.pulseAge === null) return null;
    const { maximumRadius, halfWidth, pulseDuration } = glyphPulseMetrics(
      hero.x,
      hero.y,
      hero.cascadeDuration,
    );
    const distance = Math.hypot(x - hero.x, y - hero.y);
    if (hero.pulseAge < 0 || hero.pulseAge > pulseDuration) return null;
    const radius = lerp(
      -halfWidth,
      maximumRadius + halfWidth,
      hero.pulseAge / pulseDuration,
    );
    const delta = distance - radius;
    if (Math.abs(delta) > halfWidth) return null;
    const progress = clamp(
      (halfWidth - delta) / (halfWidth * 2),
      0,
      1,
    );
    return {
      progress,
      strength: Math.sin(progress * Math.PI) ** 0.82,
    };
  }

  function drawHero(hero, wakeStartChannels, wakeEndChannels) {
    if (!hero || !hero.drawGlyphs) return;
    const heroColorChannels = colorChannels(state.heroColor);
    const glyphDuration = Math.max(0.04, hero.cascadeDuration * 0.36);
    const delaySpan = Math.max(0, hero.cascadeDuration - glyphDuration);
    const lastIndex = Math.max(1, hero.glyphs.length - 1);
    const deletionLastIndex = Math.max(
      1,
      hero.glyphs.length - (state.heroCursorEnabled ? 0 : 1),
    );
    const entranceScale =
      0.96 +
      springOut(
        hero.age / Math.max(0.08, hero.cascadeDuration * 0.72),
      ) *
        0.04;

    context.save();
    context.textAlign = "center";
    context.textBaseline = "middle";
    context.font = `${state.heroFontWeight} ${state.heroTextSize}px ${FONT_STACK}`;
    const glyphPositions = hero.glyphs.map((_, characterIndex) => {
      const offset = hero.measurement.offsets[characterIndex] ?? 0;
      return (
        hero.x +
        (offset - hero.measurement.width / 2) * entranceScale
      );
    });
    const rolloverTime = Number.isFinite(hero.rolloverTime)
      ? hero.rolloverTime
      : null;
    if (rolloverTime !== null) {
      heroRuntime.rolloverCascadeStarts.forEach((startedAt, characterIndex) => {
        if (rolloverTime - startedAt >= HERO_ROLLOVER_GLYPH_DURATION) {
          heroRuntime.rolloverCascadeStarts.delete(characterIndex);
        }
      });
    }
    if (hero.rolloverEnabled && !REDUCED_MOTION && rolloverTime !== null) {
      const nominalAdvance =
        glyphPositions.length > 1
          ? Math.abs(glyphPositions[1] - glyphPositions[0])
          : state.heroTextSize * 0.62;
      const characterHitRadius = Math.max(10, nominalAdvance * 0.5);
      let hoveredCharacterIndex = -1;
      let nearestDistance = Infinity;
      if (
        pointer.active &&
        Math.abs(pointer.y - hero.y) <= state.heroTextSize * 0.68
      ) {
        hero.glyphs.forEach((glyph, characterIndex) => {
          if (!glyph.trim()) return;
          const distance = Math.abs(pointer.x - glyphPositions[characterIndex]);
          if (
            distance <= characterHitRadius &&
            distance < nearestDistance
          ) {
            hoveredCharacterIndex = characterIndex;
            nearestDistance = distance;
          }
        });
      }
      if (
        hoveredCharacterIndex >= 0 &&
        hoveredCharacterIndex !==
          heroRuntime.rolloverHoveredCharacterIndex
      ) {
        const activeStart = heroRuntime.rolloverCascadeStarts.get(
          hoveredCharacterIndex,
        );
        if (
          activeStart === undefined ||
          rolloverTime - activeStart >= HERO_ROLLOVER_GLYPH_DURATION
        ) {
          heroRuntime.rolloverCascadeStarts.set(
            hoveredCharacterIndex,
            rolloverTime,
          );
        }
      }
      heroRuntime.rolloverHoveredCharacterIndex = hoveredCharacterIndex;
    }
    hero.glyphs.forEach((original, characterIndex) => {
      const delay = (characterIndex / lastIndex) * delaySpan;
      const localElapsed = hero.age - delay;
      if (localElapsed < 0 || !original.trim()) return;
      const glyphProgress = clamp(localElapsed / glyphDuration, 0, 1);
      let glyph = original;
      let color = state.heroColor;
      if (glyphProgress < 1) {
        const stage = Math.min(
          WAKE_GLYPHS.length - 1,
          Math.floor(glyphProgress * WAKE_GLYPHS.length),
        );
        glyph = WAKE_GLYPHS[stage];
        color = mixedColor(
          wakeStartChannels,
          heroColorChannels,
          smootherstep(glyphProgress),
        );
      }
      const deletionDelay =
        !state.heroCursorEnabled && hero.glyphs.length === 1
          ? delaySpan
          : (characterIndex / deletionLastIndex) * delaySpan;
      const deletionElapsed = hero.exitElapsed - deletionDelay;
      if (deletionElapsed >= glyphDuration) return;
      if (deletionElapsed >= 0) {
        const deletionProgress = clamp(
          deletionElapsed / glyphDuration,
          0,
          0.999,
        );
        const stage = Math.min(
          WAKE_GLYPHS.length - 1,
          Math.floor(deletionProgress * WAKE_GLYPHS.length),
        );
        glyph = WAKE_GLYPHS[stage];
        color = mixedColor(
          heroColorChannels,
          wakeEndChannels,
          smootherstep(deletionProgress),
        );
      }
      const x = glyphPositions[characterIndex];
      const rolloverStartedAt = heroRuntime.rolloverCascadeStarts.get(
        characterIndex,
      );
      const rolloverElapsed =
        rolloverTime !== null && rolloverStartedAt !== undefined
          ? rolloverTime - rolloverStartedAt
          : Infinity;
      if (
        rolloverElapsed >= 0 &&
        rolloverElapsed < HERO_ROLLOVER_GLYPH_DURATION
      ) {
        const rolloverProgress = clamp(
          rolloverElapsed / HERO_ROLLOVER_GLYPH_DURATION,
          0,
          0.999,
        );
        const rolloverStage = Math.min(
          WAKE_GLYPHS.length - 1,
          Math.floor(rolloverProgress * WAKE_GLYPHS.length),
        );
        glyph = WAKE_GLYPHS[rolloverStage];
        color = mixedColor(
          wakeStartChannels,
          heroColorChannels,
          smootherstep(rolloverProgress),
        );
      }
      const glyphEntrance = smootherstep(
        localElapsed / Math.max(0.04, glyphDuration * 0.35),
      );
      context.globalAlpha = glyphEntrance;
      context.fillStyle = color;
      context.fillText(glyph, x, hero.y);
    });
    if (state.heroCursorEnabled && hero.age >= hero.cascadeDuration) {
      const blinkElapsed = hero.age - hero.cascadeDuration;
      const blinkPhase =
        (blinkElapsed % HERO_CURSOR_BLINK_DURATION) /
        HERO_CURSOR_BLINK_DURATION;
      const cursorDeletionElapsed = hero.exitElapsed - delaySpan;
      const cursorDeleting = cursorDeletionElapsed >= 0;
      const cursorDeleted = cursorDeletionElapsed >= glyphDuration;
      const cursorVisible =
        hero.exitElapsed >= 0 || cursorDeleting || blinkPhase < 0.62;
      if (cursorVisible && !cursorDeleted) {
        const cursorX =
          hero.x +
          (hero.measurement.width / 2) * entranceScale +
          state.heroCharacterSpacing +
          hero.cursorWidth / 2;
        let cursorGlyph = HERO_CURSOR_GLYPH;
        let cursorColor = state.heroColor;
        if (cursorDeleting) {
          const deletionProgress = clamp(
            cursorDeletionElapsed / glyphDuration,
            0,
            0.999,
          );
          const stage = Math.min(
            WAKE_GLYPHS.length - 1,
            Math.floor(deletionProgress * WAKE_GLYPHS.length),
          );
          cursorGlyph = WAKE_GLYPHS[stage];
          cursorColor = mixedColor(
            heroColorChannels,
            wakeEndChannels,
            smootherstep(deletionProgress),
          );
        }
        context.globalAlpha = 1;
        context.fillStyle = cursorColor;
        context.fillText(cursorGlyph, cursorX, hero.y);
      }
    }
    context.restore();
  }

  function clearWakeReplacementActivity() {
    pendingWordReplacements.clear();
    scheduledPulseReplacements.clear();
    wordReplacements.clear();
    cellClaims.clear();
    plannedCellClaims.clear();
    wakeStates.clear();
    wakeSequence = 0;
    replacementRevision += 1;
    randomMaskCache = { key: "", mask: new Set() };
  }

  function clearWakeReplacements({ resetSequence = false } = {}) {
    clearWakeReplacementActivity();
    resetHeroRuntime(animationElapsedNow(), { resetSequence });
  }

  function wakeGlyphFor(wordId, id, x, y, time, fallback) {
    for (let index = trail.length - 1; index >= 0; index -= 1) {
      const sample = trail[index];
      const age = time - sample.time;
      if (age < 0 || age > state.wakeDuration) continue;
      const dx = x - sample.x;
      const dy = y - sample.y;
      const lateral = Math.abs(dx * -sample.directionY + dy * sample.directionX);
      const longitudinal = dx * sample.directionX + dy * sample.directionY;
      const progress = clamp(age / state.wakeDuration, 0, 1);
      const wakeCenter = 5 + progress ** 0.72 * state.wakeSpread;
      const thickness = Math.max(7, state.textSize * 0.32) * (1 - progress * 0.25);
      const backflow = -progress * (12 + sample.speed * 26);
      const reach = 22 + sample.speed * 14;
      if (
        Math.abs(lateral - wakeCenter) <= thickness &&
        Math.abs(longitudinal - backflow) <= reach
      ) {
        const existing = wakeStates.get(id);
        if (!existing || time >= existing.release) {
