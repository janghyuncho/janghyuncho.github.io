          const end = time + state.wakeDuration * 0.72;
          wakeStates.set(id, {
            start: time,
            end,
            release: time + state.wakeDuration * 1.15,
          });
          queueWordReplacement(wordId, end);
        }
        break;
      }
    }

    const wake = wakeStates.get(id);
    if (!wake || time >= wake.end) {
      if (wake && time >= wake.release) wakeStates.delete(id);
      return { glyph: fallback, active: false, progress: 1 };
    }
    const progress = clamp((time - wake.start) / (wake.end - wake.start), 0, 0.999);
    const stage = Math.min(
      WAKE_GLYPHS.length - 1,
      Math.floor(progress * WAKE_GLYPHS.length),
    );
    return { glyph: WAKE_GLYPHS[stage], active: true, progress };
  }

  function draw(timestamp) {
    const bounds = canvas.getBoundingClientRect();
    updateViewGeometry(bounds);
    const dpr = canvas.width / Math.max(1, bounds.width);
    const data = layout();
    const populateDuration = state.populateDuration / state.revealSpeed;
    const elapsed = REDUCED_MOTION
      ? populateDuration + 0.5
      : (timestamp - animationStart) / 1000;
    const generation = Math.floor(
      elapsed / Math.max(0.1, state.randomInterval),
    );
    retireCompletedWordReplacements(elapsed);
    finalizeDueReplacementRequests(elapsed);
    const hero = heroPresentationFor(elapsed, data);
    const heroBlockedCellIds = blockedCellsForHero(data, hero);
    if (hero && heroRuntime.pulseReplacementSchedulePending) {
      schedulePulsePostWakeWords(
        data,
        heroRuntime.pulseStartedAt ?? heroRuntime.startedAt,
        blockedCellsForHero(data, hero, true),
      );
      heroRuntime.pulseReplacementSchedulePending = false;
    }
    const heroRoomProgress = heroRoomProgressByCell(
      data,
      hero,
      heroBlockedCellIds,
    );
    const cellContents = data.cells.map((cell) => {
      const claim = cellClaims.get(cell.index);
      const replacement = claim
        ? wordReplacements.get(claim.anchorId)
        : null;
      const glyphs = displayGlyphsForCell(
        cell,
        replacement,
        claim?.chunkIndex ?? 0,
        elapsed,
      );
      const chunkArrivalAt = replacement
        ? replacementChunkArrivalAt(
            replacement,
            claim?.chunkIndex ?? 0,
          )
        : Infinity;
      const chunkArrived = elapsed >= chunkArrivalAt;
      return {
        cell,
        glyphs,
        measurement:
          glyphs === cell.baseGlyphs
            ? cell.baseMeasurement
            : measureGridGlyphs(glyphs),
        replacement,
        claim,
        chunkArrivalAt,
        chunkArrived,
      };
    });
    const glyphIds = [];
    cellContents.forEach(({ cell, glyphs }) => {
      glyphs.forEach((glyph, characterIndex) => {
        if (!glyph) return;
        glyphIds.push(cell.index * GLYPH_ID_STRIDE + characterIndex);
      });
    });
    const randomMask = randomMaskFor(generation, glyphIds);
    const shuffleStart = populateDuration * 0.35;
    const shuffleElapsed = elapsed - shuffleStart;
    const shuffleGeneration =
      shuffleElapsed >= 0
        ? Math.floor(shuffleElapsed / state.sectionShuffleInterval)
        : -1;
    const currentSectionMask = sectionShuffleMask(
      shuffleGeneration,
      data.sectionCount,
    );
    const previousSectionMask = sectionShuffleMask(
      shuffleGeneration - 1,
      data.sectionCount,
    );
    const shuffleChangeElapsed =
      shuffleGeneration < 0
        ? Infinity
        : shuffleElapsed -
          shuffleGeneration * state.sectionShuffleInterval;

    context.setTransform(1, 0, 0, 1, 0, 0);
    context.globalAlpha = 1;
    context.clearRect(0, 0, canvas.width, canvas.height);
    const cropOffset = viewCropOffset(bounds);
    context.setTransform(
      dpr * viewScale,
      0,
      0,
      dpr * viewScale,
      -cropOffset.x * dpr * viewScale,
      -cropOffset.y * dpr * viewScale,
    );
    context.textAlign = "center";
    context.textBaseline = "middle";
    context.font = `${state.fontWeight} ${state.textSize}px ${FONT_STACK}`;
    const wakeStartChannels = colorChannels(state.wakeStartColor);
    const wakeEndChannels = colorChannels(state.wakeEndColor);
    const postWakeChannels = colorChannels(state.postWakeColor);
    const glyphPulseStartChannels = colorChannels(
      state.glyphPulseStartColor,
    );
    const glyphPulseEndChannels = colorChannels(state.glyphPulseEndColor);
    const glyphColorChannels = colorChannels(state.glyphColor);

    cellContents.forEach(({
      cell,
      glyphs,
      measurement,
      replacement,
      chunkArrivalAt,
      chunkArrived,
    }) => {
      const previousVisible = !previousSectionMask.has(cell.sectionIndex);
      const currentVisible = !currentSectionMask.has(cell.sectionIndex);
      let sectionVisibility = currentVisible ? 1 : 0;
      if (
        shuffleGeneration >= 0 &&
        previousVisible !== currentVisible
      ) {
        const wordRandomness = state.sectionWordRandomness;
        const delayLimit = Math.min(
          0.42,
          state.sectionShuffleInterval * 0.34,
        ) * wordRandomness;
        const wordDelay =
          hash(cell.index, shuffleGeneration, 561, state.patternSeed) *
          delayLimit;
        const availableDuration = Math.max(
          0.04,
          state.sectionShuffleInterval - wordDelay - 0.01,
        );
        const wordDuration = clamp(
          state.fadeInDuration *
            (1 +
              (hash(cell.index, shuffleGeneration, 563, state.patternSeed) -
                0.5) *
                0.7 *
                wordRandomness),
          0.04,
          availableDuration,
        );
        const transition = smootherstep(
          (shuffleChangeElapsed - wordDelay) / wordDuration,
        );
        sectionVisibility = lerp(
          previousVisible ? 1 : 0,
          currentVisible ? 1 : 0,
          transition,
        );
      }
      if (
        pendingWordReplacements.has(cell.index) ||
        chunkArrived
      ) {
        sectionVisibility = 1;
      }
      if (heroBlockedCellIds.has(cell.index)) {
        sectionVisibility *=
          1 - (heroRoomProgress.get(cell.index) ?? 0);
      }
      if (sectionVisibility <= 0.002) return;
      const revealAt = sectionRevealAt(cell, data, populateDuration);
      const revealProgress = smootherstep(
        (elapsed - revealAt) / state.fadeInDuration,
      );
      const alpha = revealProgress * sectionVisibility;
      if (alpha <= 0.002) return;
      const slotCenter = cell.x + cell.slotWidth / 2;
      const wordCenter = measurement.width / 2;
      const postWakeProgress =
        !replacement ||
        !chunkArrived ||
        state.postWakeColorDuration <= 0
          ? 1
          : smootherstep(
              (elapsed - chunkArrivalAt) /
                state.postWakeColorDuration,
            );
      const settledColor = replacement && chunkArrived
        ? mixedColor(
            postWakeChannels,
            glyphColorChannels,
            postWakeProgress,
          )
        : state.glyphColor;

      glyphs.forEach((original, characterIndex) => {
        if (!original) return;
        const glyphId =
          cell.index * GLYPH_ID_STRIDE + characterIndex;
        const offset = measurement.offsets[characterIndex] ?? 0;
        const x = slotCenter + offset - wordCenter;
        const y = cell.y;
        const randomized = randomGlyphFor(
          glyphId,
          generation,
          original,
          randomMask,
        );
        const wake = wakeGlyphFor(
          cell.index,
          glyphId,
          x,
          y,
          elapsed,
          randomized,
        );
        const heroPulse = heroColorPulseAt(x, y, hero);
        let pulsedColor = settledColor;
        let renderedGlyph = wake.glyph;
        if (heroPulse && heroPulse.strength > 0.02) {
          pulsedColor = mixedColor(
            glyphPulseStartChannels,
            glyphPulseEndChannels,
            smootherstep(heroPulse.progress),
          );
          if (!wake.active) {
            const stage = Math.min(
              pulseGlyphs.length - 1,
              Math.floor(heroPulse.progress * pulseGlyphs.length),
            );
            renderedGlyph = pulseGlyphs[stage];
          }
        }
        context.globalAlpha = alpha;
        context.fillStyle = wake.active
          ? mixedColor(
              wakeStartChannels,
              wakeEndChannels,
              smootherstep(wake.progress),
            )
          : pulsedColor;
        context.fillText(renderedGlyph, x, y);
      });
    });
    context.globalAlpha = 1;
    drawHero(hero, wakeStartChannels, wakeEndChannels);
    drawHero(hero?.handoff, wakeStartChannels, wakeEndChannels);

    while (trail.length && elapsed - trail[0].time > state.wakeDuration) {
      trail.shift();
    }
    wakeStates.forEach((wake, id) => {
      if (elapsed >= wake.release) wakeStates.delete(id);
    });
  }

  function eventPoint(event) {
    const bounds = canvas.getBoundingClientRect();
    updateViewGeometry(bounds);
    const cropOffset = viewCropOffset(bounds);
    return {
      x:
        cropOffset.x +
        (event.clientX - bounds.left) / Math.max(0.0001, viewScale),
      y:
        cropOffset.y +
        (event.clientY - bounds.top) / Math.max(0.0001, viewScale),
    };
  }

  function addTrail(x, y, time) {
    const dx = x - pointer.previousX;
    const dy = y - pointer.previousY;
    const distance = Math.hypot(dx, dy);
    if (distance < 4) return;
    const directionX = dx / distance;
    const directionY = dy / distance;
    const steps = clamp(Math.ceil(distance / 22), 1, 18);
    for (let step = 1; step <= steps; step += 1) {
      const progress = step / steps;
      trail.push({
        x: pointer.previousX + dx * progress,
        y: pointer.previousY + dy * progress,
        time,
        directionX,
        directionY,
        speed: clamp(pointer.speed / 1300, 0, 1),
      });
    }
    if (trail.length > 128) trail.splice(0, trail.length - 128);
  }

  function animate(timestamp) {
    frameRequest = 0;
    previousTimestamp = timestamp;
    draw(timestamp);
    scheduleAnimation();
  }

  function scheduleAnimation() {
    if (
      !fontReady ||
      REDUCED_MOTION ||
      !hostActive ||
      !pageVisible ||
      !canvasVisible ||
      frameRequest
    ) {
      return;
    }
    frameRequest = requestAnimationFrame(animate);
  }

  function refreshStaticFrame() {
    if (fontReady && REDUCED_MOTION) {
      draw(performance.now());
    }
  }

  function animationElapsedNow() {
    return Math.max(0, (performance.now() - animationStart) / 1000);
  }

  function restartAnimation({ newSeed = false } = {}) {
    if (newSeed) state.patternSeed = (state.patternSeed % 9999) + 1;
    animationStart = performance.now();
    introHeroPending = true;
    trail.length = 0;
    clearWakeReplacements({ resetSequence: true });
    sectionShuffleMaskCache.clear();
    layoutCache = null;
    saveState();
    refreshStaticFrame();
  }

  function clearWakeReplacementsForSettingChange() {
    const openingSequenceActive =
      introHeroPending ||
      (heroRuntime.triggerSource === "intro" &&
        (heroRuntime.active || heroRuntime.returning));
    if (openingSequenceActive) {
      animationStart = performance.now();
      introHeroPending = true;
      trail.length = 0;
      clearWakeReplacements({ resetSequence: true });
      return;
    }
    const persistentSequenceActive =
      state.continuousHeadlinesEnabled &&
      (heroRuntime.persistent ||
        heroRuntime.phase === "persistent-enter" ||
        heroRuntime.phase === "persistent-exit");
    if (persistentSequenceActive) {
      // Layout and replacement edits can safely clear their transient maps
      // without collapsing the room held by a continuous headline.
      trail.length = 0;
      clearWakeReplacementActivity();
      heroRuntime.pulseStartedAt = null;
      heroRuntime.pulseReplacementSchedulePending = false;
      heroRuntime.armed = true;
      return;
    }
    clearWakeReplacements();
  }

  function syncControls() {
    document.querySelectorAll("[data-step-setting]").forEach((control) => {
      const key = control.dataset.stepSetting;
      if (!(key in state)) return;
      if (control.type === "checkbox") control.checked = Boolean(state[key]);
      else control.value = state[key];
    });
    document.querySelectorAll("[data-step-output]").forEach((output) => {
      const key = output.dataset.stepOutput;
      const value = state[key];
      if (COLOR_KEYS.includes(key)) {
        output.textContent = rgbColorLabel(value);
      } else if (
        [
          "randomAmount",
          "sectionShuffleAmount",
          "sectionWordRandomness",
          "returnCharacterRandomness",
          "heroTriggerAmount",
          "heroIdlePostWakeAmount",
          "heroTransitionOverlap",
        ].includes(key)
      ) {
        output.textContent = `${Math.round(value * 100)}%`;
      } else if (["revealSpeed", "glyphPulseSpeed"].includes(key)) {
        output.textContent = `${Number(value).toFixed(2)}×`;
      } else if (
        [
          "populateDuration",
          "fadeInDuration",
          "sectionShuffleInterval",
          "randomInterval",
          "wakeDuration",
          "afterWakeStringDuration",
          "postWakeColorDuration",
          "heroIdleDelay",
          "heroHoldDuration",
          "continuousInitialDuration",
          "continuousSubsequentDuration",
          "heroCascadeDuration",
          "heroReturnStagger",
        ].includes(key)
      ) {
        output.textContent = `${Number(value).toFixed(2)} s`;
      } else if (
        [
          "sectionCount",
          "columns",
          "rows",
          "fontWeight",
          "heroFontWeight",
          "heroReturnSubsections",
        ].includes(key)
      ) {
        output.textContent = `${Math.round(value)}`;
      } else if (key === "flowMaxCells") {
        output.textContent = `${Math.round(value)} cells`;
      } else {
        output.textContent = `${Math.round(value)} px`;
      }
    });
    document.querySelectorAll("[data-step-color-hex]").forEach((control) => {
      const key = control.dataset.stepColorHex;
      if (COLOR_KEYS.includes(key)) {
        control.value = state[key].slice(1).toUpperCase();
      }
    });
    renderModeControls();
  }

  function setupCollapsibleSections() {
    document.querySelectorAll(".control-section").forEach((section, index) => {
      if (section.dataset.collapsibleReady === "true") return;
      const heading = [...section.children].find((child) =>
        child.matches("h2, legend"),
      );
      if (!heading) return;

      const body = document.createElement("div");
      body.className = "control-section__body";
      body.id = `step-control-section-${index + 1}`;
      let sibling = heading.nextSibling;
      while (sibling) {
        const nextSibling = sibling.nextSibling;
        body.appendChild(sibling);
        sibling = nextSibling;
      }
      section.appendChild(body);

      const button = document.createElement("button");
      button.type = "button";
      button.className = "control-section__toggle";
      button.textContent = heading.textContent.trim();
      button.setAttribute("aria-expanded", "true");
      button.setAttribute("aria-controls", body.id);
      heading.replaceChildren(button);
      button.addEventListener("click", () => {
        const expanded = button.getAttribute("aria-expanded") === "true";
        button.setAttribute("aria-expanded", String(!expanded));
        body.hidden = expanded;
        section.classList.toggle("is-collapsed", expanded);
      });
      section.dataset.collapsibleReady = "true";
    });
  }

  function setupControls() {
    setupCollapsibleSections();
    syncControls();
    const layoutSettings = new Set([
      "sourceText",
      "textSize",
      "fontWeight",
      "characterSpacing",
      "columnSpacing",
      "rowSpacing",
      "columns",
      "rows",
      "sectionCount",
    ]);
    document.querySelectorAll("[data-step-setting]").forEach((control) => {
      control.addEventListener("input", () => {
        const key = control.dataset.stepSetting;
        const replacementChanged = /^replacementString[1-8]$/.test(key);
        if (control.type === "checkbox") {
          state[key] = control.checked;
        } else if (key === "sourceText") {
          sourceGlyphs = splitGraphemes(control.value).slice(0, 24);
          if (!sourceGlyphs.length) sourceGlyphs = ["W"];
          state.sourceText = sourceGlyphs.join("");
        } else if (HERO_TEXT_KEYS.includes(key)) {
          state[key] = splitGraphemes(control.value).slice(0, 48).join("");
        } else if (replacementChanged) {
          state[key] = splitGraphemes(control.value).slice(0, 144).join("");
        } else if (key === "characterPool") {
          randomGlyphs = splitGraphemes(control.value)
            .filter((glyph) => !/\s|,/.test(glyph))
            .slice(0, 160);
          if (!randomGlyphs.length) randomGlyphs = ["✦"];
          state.characterPool = randomGlyphs.join("");
        } else if (key === "paddingGlyphPool") {
          paddingGlyphs = splitGraphemes(control.value)
            .filter((glyph) => !/\s|,/.test(glyph))
            .slice(0, 160);
          if (!paddingGlyphs.length) paddingGlyphs = ["░"];
          state.paddingGlyphPool = paddingGlyphs.join("");
        } else if (key === "glyphPulseGlyphs") {
          pulseGlyphs = splitGraphemes(control.value)
            .filter((glyph) => !/\s|,/.test(glyph))
            .slice(0, 32);
          if (!pulseGlyphs.length) pulseGlyphs = ["█"];
          state.glyphPulseGlyphs = pulseGlyphs.join("");
        } else if (COLOR_KEYS.includes(key)) {
          if (HEX_COLOR.test(control.value)) state[key] = control.value;
        } else {
          const [minimum, configuredMaximum] = LIMITS[key];
          const maximum =
            key === "heroPositionX"
              ? WIDTH
              : key === "heroPositionY"
                ? HEIGHT
                : configuredMaximum;
          state[key] = clamp(Number(control.value), minimum, maximum);
        }
        if (["sectionCount", "columns", "rows"].includes(key)) {
          state.sectionCount = Math.min(
            Math.round(state.sectionCount),
            Math.round(state.columns) * Math.round(state.rows),
          );
        }
        if (layoutSettings.has(key)) {
          layoutCache = null;
          clearWakeReplacementsForSettingChange();
        } else if (
          replacementChanged ||
          key === "padReplacementStrings" ||
          key === "characterPool" ||
          key === "paddingGlyphPool" ||
          key === "flowLongStringsEnabled" ||
          key === "flowMaxCells" ||
          key === "flowWrapRows"
        ) {
          clearWakeReplacementsForSettingChange();
        }
        if (key === "continuousHeadlinesEnabled") {
          // The toggle changes the headline lifecycle itself. Restart from a
          // known sequence boundary so a persistent headline cannot leak into
          // discrete mode (or vice versa).
          animationStart = performance.now();
          introHeroPending = true;
          trail.length = 0;
          clearWakeReplacements({ resetSequence: true });
        }
        if (["sectionShuffleAmount", "sectionCount"].includes(key)) {
          sectionShuffleMaskCache.clear();
        }
        if (key === "revealSpeed") {
          animationStart = performance.now();
          introHeroPending = true;
          trail.length = 0;
          clearWakeReplacements({ resetSequence: true });
        }
        saveState();
        syncControls();
        refreshStaticFrame();
      });
    });
    document.querySelectorAll("[data-step-color-hex]").forEach((control) => {
      const key = control.dataset.stepColorHex;
      const applyHexValue = () => {
        const color = normalizedHexColor(control.value);
        if (!color || !COLOR_KEYS.includes(key)) return false;
        state[key] = color;
        saveState();
        syncControls();
        refreshStaticFrame();
        return true;
      };
      control.addEventListener("input", applyHexValue);
      control.addEventListener("change", () => {
        if (!applyHexValue()) {
          control.value = state[key].slice(1).toUpperCase();
        }
      });
      control.addEventListener("blur", () => {
        if (!normalizedHexColor(control.value)) {
          control.value = state[key].slice(1).toUpperCase();
        }
      });
    });
    document
      .querySelector("#step-repeat-restart")
      ?.addEventListener("click", () => restartAnimation());
    document
      .querySelector("#step-repeat-pattern")
      ?.addEventListener("click", () => restartAnimation({ newSeed: true }));
    document.querySelectorAll("[data-step-theme]").forEach((button) => {
      button.addEventListener("click", () => {
        setActiveTheme(button.dataset.stepTheme);
      });
    });
    document.querySelectorAll("[data-step-format]").forEach((button) => {
      button.addEventListener("click", () => {
        setActiveFormat(button.dataset.stepFormat);
      });
    });
    const saveSettingsButton = document.querySelector(
      "#step-save-settings, #step-save-variant",
    );
    saveSettingsButton?.addEventListener("click", () => {
      try {
        saveState();
        renderModeControls();
        showSettingsStatus("Settings saved for all modes.");
      } catch {
        showSettingsStatus("Settings could not be saved.");
      }
    });
    document
      .querySelector("#step-preview-desktop")
      ?.addEventListener("click", () => {
        if (activeFormat !== "desktop") setActiveFormat("desktop");
        else saveState();
        const link = document.createElement("a");
        link.href = desktopBlogPreviewUrl();
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.hidden = true;
        document.body.append(link);
        link.click();
        link.remove();
        showSettingsStatus(
          "Local blog preview opened with the current desktop settings.",
        );
      });
    document
      .querySelector("#step-share-canvas")
      ?.addEventListener("click", shareCanvasHtml);
    document.querySelector("#step-repeat-reset")?.addEventListener("click", () => {
      if (!snapshotReadOnly) {
        try {
          window.localStorage.removeItem(STORAGE_KEY);
        } catch {
          // Reset still applies to the current page.
        }
      }
      settingsModel = normalizeUnifiedModel(null, false);
      activeTheme = "light";
      activeFormat = "desktop";
      WIDTH = FORMAT_DIMENSIONS.desktop.width;
      HEIGHT = FORMAT_DIMENSIONS.desktop.height;
      pointer.x = WIDTH / 2;
      pointer.y = HEIGHT / 2;
      pointer.previousX = pointer.x;
      pointer.previousY = pointer.y;
      renderModeControls();
      resizeCanvas();
      applySettings(composedSettings(), "All settings reset.");
    });
  }

  canvas.addEventListener("pointerenter", (event) => {
    const point = eventPoint(event);
    pointer.active = true;
    pointer.x = point.x;
    pointer.y = point.y;
    pointer.previousX = point.x;
    pointer.previousY = point.y;
    pointer.previousTime = event.timeStamp || performance.now();
  });

  canvas.addEventListener("pointermove", (event) => {
    const point = eventPoint(event);
    const eventTime = event.timeStamp || performance.now();
    const elapsedMilliseconds = clamp(eventTime - pointer.previousTime, 4, 80);
    pointer.speed = lerp(
      pointer.speed,
      (Math.hypot(point.x - pointer.previousX, point.y - pointer.previousY) /
        elapsedMilliseconds) *
        1000,
      0.35,
    );
    const animationTime = REDUCED_MOTION
      ? state.populateDuration / state.revealSpeed + 0.5
      : animationElapsedNow();
    addTrail(point.x, point.y, animationTime);
    pointer.active = true;
    pointer.x = point.x;
    pointer.y = point.y;
    pointer.previousX = point.x;
    pointer.previousY = point.y;
    pointer.previousTime = eventTime;
    if (fontReady && REDUCED_MOTION) draw(performance.now());
  });

  canvas.addEventListener("pointerdown", (event) => {
    pointer.id = event.pointerId;
    canvas.setPointerCapture?.(event.pointerId);
  });
  canvas.addEventListener("pointerup", (event) => {
    if (canvas.hasPointerCapture?.(event.pointerId)) {
      canvas.releasePointerCapture(event.pointerId);
    }
    pointer.id = null;
  });
  canvas.addEventListener("pointerleave", () => {
    pointer.active = false;
    heroRuntime.rolloverHoveredCharacterIndex = -1;
  });
  canvas.addEventListener("pointercancel", () => {
    pointer.id = null;
    pointer.active = false;
    heroRuntime.rolloverHoveredCharacterIndex = -1;
  });

  const resizeObserver = new ResizeObserver(() => {
    resizeCanvas();
    if (fontReady) {
      draw(performance.now());
    }
  });
  resizeObserver.observe(canvas);
  function refreshCanvasVisibility() {
    const bounds = canvas.getBoundingClientRect();
    canvasVisible =
      bounds.width > 0 &&
      bounds.height > 0 &&
      bounds.bottom >= -120 &&
      bounds.top <= window.innerHeight + 120;
  }
  function syncAnimationActivity() {
    if ((!hostActive || !pageVisible || !canvasVisible) && frameRequest) {
      cancelAnimationFrame(frameRequest);
      frameRequest = 0;
    }
    scheduleAnimation();
  }
  if (typeof IntersectionObserver === "function") {
    const observer = new IntersectionObserver(
      ([entry]) => {
        canvasVisible = entry.isIntersecting;
        syncAnimationActivity();
      },
      { rootMargin: "120px" },
    );
    observer.observe(canvas);
  }
  document.addEventListener("visibilitychange", () => {
    pageVisible = !document.hidden;
    if (pageVisible) {
      resizeCanvas();
      refreshCanvasVisibility();
    }
    syncAnimationActivity();
  });
  window.addEventListener("message", (event) => {
    if (
      event.source !== window.parent ||
      event.data?.type !== "ecto1:html-artifact-activity"
    ) {
      return;
    }
    hostActive = event.data.active === true;
    if (hostActive) {
      resizeCanvas();
      refreshCanvasVisibility();
    }
    syncAnimationActivity();
  });
  window.addEventListener("resize", () => {
    if (!syncResponsiveFormat()) resizeCanvas();
  });

  async function initialize() {
    setupControls();
    emitStepRepeatState("ready", null, "step-repeat:ready");
    resizeCanvas();
    try {
      if (document.fonts?.load) {
        await Promise.all([
          document.fonts.load(
            `${state.fontWeight} ${state.textSize}px "${PRIMARY_FONT_FAMILY}"`,
          ),
          document.fonts.load(
            `${state.heroFontWeight} ${state.heroTextSize}px "${PRIMARY_FONT_FAMILY}"`,
          ),
        ]);
      }
    } catch {
      // The fallback stack keeps the animation usable if font loading fails.
    }
    fontReady = true;
    layoutCache = null;
    animationStart = performance.now();
    resizeCanvas();
    if (REDUCED_MOTION) draw(performance.now());
    else scheduleAnimation();
  }

  initialize();
}

stepRepeatFlowApp();</script>
